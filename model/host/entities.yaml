groups:
  - id: entity.host
    type: entity
    stability: development
    name: host
    brief: >
        A host is defined as a computing instance. For example, physical servers, virtual machines, switches or disk array.
    attributes:
      - ref: host.id
        role: identifying
      - ref: host.name
        role: descriptive
      - ref: host.type
        role: descriptive
      - ref: host.arch
        role: descriptive
      - ref: host.image.name
        role: descriptive
      - ref: host.image.id
        role: descriptive
      - ref: host.image.version
        role: descriptive
      - ref: host.ip
        requirement_level: opt_in
        role: descriptive
      - ref: host.mac
        requirement_level: opt_in
        role: descriptive

  - id: entity.host.cpu
    type: entity
    stability: development
    name: host.cpu
    brief: >
      A host's CPU information
    attributes:
      - ref: host.cpu.vendor.id
        requirement_level: opt_in
      - ref: host.cpu.family
        requirement_level: opt_in
      - ref: host.cpu.model.id
        requirement_level: opt_in
      - ref: host.cpu.model.name
        requirement_level: opt_in
      - ref: host.cpu.stepping
        requirement_level: opt_in
      - ref: host.cpu.cache.l2.size
        requirement_level: opt_in
