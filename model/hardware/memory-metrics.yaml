# yaml-language-server: $schema=https://raw.githubusercontent.com/open-telemetry/weaver/v0.24.2/schemas/semconv.schema.v2.json
file_format: definition/2
attribute_groups:
  - id: metric_attributes.hw.memory
    visibility: internal
    attributes:
      - ref_group: hardware.attributes.common
      - ref: hw.model
        requirement_level: recommended
      - ref: hw.serial_number
        requirement_level: recommended
      - ref: hw.memory.type
        requirement_level: recommended
      - ref: hw.vendor
        requirement_level: recommended

metrics:
  - name: hw.memory.size
    requirement_level: recommended
    annotations:
      code_generation:
        metric_value_type: int
    stability: development
    brief: "Size of the memory module."
    instrument: updowncounter
    unit: "By"
    attributes:
      - ref_group: metric_attributes.hw.memory

metric_refinements:
  - id: metric.hw.memory.errors
    ref: hw.errors
    attributes:
      - ref_group: metric_attributes.hw.memory

  - id: metric.hw.memory.status
    ref: hw.status
    attributes:
      - ref_group: metric_attributes.hw.memory
