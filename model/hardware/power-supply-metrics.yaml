# yaml-language-server: $schema=https://raw.githubusercontent.com/open-telemetry/weaver/v0.25.1/schemas/semconv.schema.v2.json
file_format: definition/2
attribute_groups:
  - id: metric_attributes.hw.power_supply
    visibility: internal
    attributes:
      - ref_group: hardware.attributes.common
      - ref: hw.model
        requirement_level: recommended
      - ref: hw.serial_number
        requirement_level: recommended
      - ref: hw.vendor
        requirement_level: recommended

metrics:
  - name: hw.power_supply.limit
    requirement_level: recommended
    annotations:
      code_generation:
        metric_value_type: int
    stability: development
    brief: "Maximum power output of the power supply."
    instrument: updowncounter
    unit: "W"
    attributes:
      - ref_group: metric_attributes.hw.power_supply
      - ref: hw.limit_type
        examples: ["max", "critical", "throttled"]
        requirement_level: recommended

  - name: hw.power_supply.utilization
    requirement_level: recommended
    annotations:
      code_generation:
        metric_value_type: double
    stability: development
    brief: "Utilization of the power supply as a fraction of its maximum output."
    instrument: gauge
    unit: "1"
    attributes:
      - ref_group: metric_attributes.hw.power_supply

  - name: hw.power_supply.usage
    requirement_level: recommended
    annotations:
      code_generation:
        metric_value_type: double
    stability: development
    brief: "Current power output of the power supply."
    instrument: updowncounter
    unit: "W"
    attributes:
      - ref_group: metric_attributes.hw.power_supply

metric_refinements:
  - id: metric.hw.power_supply.status
    ref: hw.status
    attributes:
      - ref_group: metric_attributes.hw.power_supply
      - ref: hw.type
        note: "MUST be set to `power_supply`."
        examples: ["power_supply"]
      - ref: hw.state
        note: |
          MUST be set to one of the following values:

          * `ok`: The power supply is operating normally.
          * `degraded`: The power supply is operating with reduced functionality or performance.
          * `failed`: The power supply has failed and is not operational.
        examples: ["ok", "degraded", "failed"]
