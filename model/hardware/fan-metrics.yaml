# yaml-language-server: $schema=https://raw.githubusercontent.com/open-telemetry/weaver/v0.24.2/schemas/semconv.schema.v2.json
file_format: definition/2
metrics:
  - name: hw.fan.speed
    requirement_level: recommended
    annotations:
      code_generation:
        metric_value_type: int
      naming_conventions:
        # TODO hw.fan.speed is used as a namespace by hw.fan.speed.limit
        policy_exceptions:
          - metric_namespace_collision
    stability: development
    brief: "Fan speed in revolutions per minute."
    instrument: gauge
    unit: "rpm"
    attributes:
      - ref_group: hardware.attributes.common
      - ref: hw.sensor_location
        requirement_level: recommended

  - name: hw.fan.speed.limit
    requirement_level: recommended
    annotations:
      code_generation:
        metric_value_type: int
    stability: development
    brief: "Speed limit in rpm."
    instrument: gauge
    unit: "rpm"
    attributes:
      - ref_group: hardware.attributes.common
      - ref: hw.sensor_location
        requirement_level: recommended
      - ref: hw.limit_type
        examples: ["low.critical", "low.degraded", "max"]
        requirement_level: recommended

  - name: hw.fan.speed_ratio
    requirement_level: recommended
    annotations:
      code_generation:
        metric_value_type: double
    stability: development
    brief: "Fan speed expressed as a fraction of its maximum speed."
    instrument: gauge
    unit: "1"
    attributes:
      - ref_group: hardware.attributes.common
      - ref: hw.sensor_location
        requirement_level: recommended

metric_refinements:
  - id: metric.hw.fan.status
    ref: hw.status
    attributes:
      - ref_group: hardware.attributes.common
      - ref: hw.sensor_location
        requirement_level: recommended
