# yaml-language-server: $schema=https://raw.githubusercontent.com/open-telemetry/weaver/v0.25.1/schemas/semconv.schema.v2.json
file_format: definition/2
attribute_groups:
  - id: metric_attributes.hw.tape_drive
    visibility: internal
    attributes:
      - ref_group: hardware.attributes.common
      - ref: hw.model
        requirement_level: recommended
      - ref: hw.serial_number
        requirement_level: recommended
      - ref: hw.vendor
        requirement_level: recommended

metrics:
  - name: hw.tape_drive.operations
    requirement_level: recommended
    annotations:
      code_generation:
        metric_value_type: int
    stability: development
    brief: "Operations performed by the tape drive."
    instrument: counter
    unit: "{operation}"
    attributes:
      - ref_group: metric_attributes.hw.tape_drive
      - ref: hw.tape_drive.operation_type
        examples: ["mount", "unmount", "clean"]
        requirement_level: recommended

metric_refinements:
  - id: metric.hw.tape_drive.errors
    ref: hw.errors
    brief: "Number of errors encountered by the tape drive."
    attributes:
      - ref_group: metric_attributes.hw.tape_drive
      - ref: hw.type
        note: "MUST be set to `tape_drive`."
        examples: ["tape_drive"]
  - id: metric.hw.tape_drive.status
    ref: hw.status
    attributes:
      - ref_group: metric_attributes.hw.tape_drive
      - ref: hw.type
        note: "MUST be set to `tape_drive`."
        examples: ["tape_drive"]
      - ref: hw.state
        note: |
          MUST be set to one of the following values:

          * `ok`: The tape drive is operating normally.
          * `degraded`: The tape drive is operating with reduced functionality or performance.
          * `failed`: The tape drive has failed and is not operational.
          * `needs_cleaning`: The tape drive requires cleaning.
        examples: ["ok", "degraded", "failed", "needs_cleaning"]
