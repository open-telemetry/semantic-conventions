groups:
  - id: registry.dotnet
    type: attribute_group
    display_name: .NET Attributes
    brief: >
      This document defines .NET related attributes.
    attributes:
      - id: dotnet.cache.name
        stability: stable
        type: string
        brief: The name of the MemoryCache instance.
        examples: ["Default", "users"]
      - id: dotnet.cache.request.result
        stability: stable
        type:
          members:
            - id: hit
              value: 'hit'
              brief: The requested value was found in the cache.
              stability: stable
            - id: miss
              value: 'miss'
              brief: The requested value was not found in the cache.
              stability: stable
        brief: The result of a MemoryCache request.
        examples: ["hit", "miss"]
      - id: dotnet.gc.heap.generation
        stability: stable
        type:
          members:
            - id: gen0
              value: 'gen0'
              brief: "Generation 0"
              stability: stable
            - id: gen1
              value: 'gen1'
              brief: "Generation 1"
              stability: stable
            - id: gen2
              value: 'gen2'
              brief: "Generation 2"
              stability: stable
            - id: loh
              value: 'loh'
              brief: "Large Object Heap"
              stability: stable
            - id: poh
              value: 'poh'
              brief: "Pinned Object Heap"
              stability: stable
        brief: Name of the garbage collector managed heap generation.
        examples: ["gen0", "gen1", "gen2"]
