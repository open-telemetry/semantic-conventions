groups:
  - id: registry.rabbitmq
    type: attribute_group
    display_name: RabbitMQ Attributes
    brief: >
      This group describes attributes specific to RabbitMQ.
    attributes:
      - id: rabbitmq.destination.routing_key
        type: string
        stability: development
        brief: >
          RabbitMQ message routing key.
        examples: 'myKey'
      - id: rabbitmq.message.delivery_tag
        type: int
        stability: development
        brief: >
          RabbitMQ message delivery tag
        examples: 123
      - id: rabbitmq.cluster.name
        type: string
        stability: development
        brief: >
          The RabbitMQ cluster name, obtained from the broker metadata exposed through
          the RabbitMQ client API.
        note: >
          RabbitMQ derives the default [cluster name](https://www.rabbitmq.com/docs/configure#cluster-name)
          from the first node in the cluster. Operators can override it with
          `rabbitmqctl set_cluster_name`.
        examples: ['my-rabbitmq-cluster']
      - id: rabbitmq.vhost.name
        type: string
        stability: development
        brief: >
          The name of the RabbitMQ virtual host that the messaging operation is scoped to.
        note: >
          RabbitMQ [virtual hosts](https://www.rabbitmq.com/docs/vhosts) provide logical grouping
          and separation of resources (exchanges, queues, bindings) within a single broker or cluster.
        examples: ['/', 'my-vhost']
