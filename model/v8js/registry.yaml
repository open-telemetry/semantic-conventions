groups:
  - id: registry.v8js
    type: attribute_group
    brief: Describes V8 JS Engine Runtime related attributes.
    display_name: V8 JS Attributes
    attributes:
      - id: v8js.gc.type
        stability: development
        brief: The type of garbage collection.
        type:
          members:
            - id: major
              value: 'major'
              brief: 'Major (Mark Sweep Compact).'
              stability: development
            - id: minor
              value: 'minor'
              brief: 'Minor (Scavenge).'
              stability: development
            - id: incremental
              value: 'incremental'
              brief: 'Incremental (Incremental Marking).'
              stability: development
            - id: weakcb
              value: 'weakcb'
              brief: 'Weak Callbacks (Process Weak Callbacks).'
              stability: development
      - id: v8js.heap.space.name
        stability: development
        brief: The name of the space type of heap memory.
        note: >
          Value can be retrieved from value `space_name` of [`v8.getHeapSpaceStatistics()`](https://nodejs.org/api/v8.html#v8getheapspacestatistics).

          The set of reported spaces depends on the V8 version the runtime embeds.
        type:
          members:
            - id: new_space
              value: 'new_space'
              brief: 'New memory space.'
              stability: development
            - id: old_space
              value: 'old_space'
              brief: 'Old memory space.'
              stability: development
            - id: code_space
              value: 'code_space'
              brief: 'Code memory space.'
              stability: development
            - id: map_space
              value: 'map_space'
              brief: 'Map memory space.'
              note: >
                Only reported by Node.js <= 19; V8 merged the map space
                into the old space in V8 11.x.
              stability: development
            - id: large_object_space
              value: 'large_object_space'
              brief: 'Large object memory space.'
              stability: development
            - id: read_only_space
              value: 'read_only_space'
              brief: 'Read-only memory space, holding immutable objects created at startup.'
              stability: development
            - id: shared_space
              value: 'shared_space'
              brief: 'Memory space for objects shared across isolates (e.g. shared strings and structs).'
              stability: development
            - id: trusted_space
              value: 'trusted_space'
              brief: 'Memory space for trusted objects kept outside the V8 sandbox (e.g. bytecode).'
              stability: development
            - id: shared_trusted_space
              value: 'shared_trusted_space'
              brief: 'Shared variant of the trusted memory space.'
              stability: development
            - id: new_large_object_space
              value: 'new_large_object_space'
              brief: 'Large object space for young-generation objects.'
              stability: development
            - id: code_large_object_space
              value: 'code_large_object_space'
              brief: 'Large object space for code objects.'
              stability: development
            - id: shared_large_object_space
              value: 'shared_large_object_space'
              brief: 'Large object space for shared objects.'
              stability: development
            - id: shared_trusted_large_object_space
              value: 'shared_trusted_large_object_space'
              brief: 'Large object space for shared trusted objects.'
              stability: development
            - id: trusted_large_object_space
              value: 'trusted_large_object_space'
              brief: 'Large object space for trusted objects.'
              stability: development
      - id: v8js.resource.type
        stability: development
        brief: The type of resource keeping the event loop active.
        type:
          members:
            - id: immediate
              value: 'Immediate'
              brief: 'Active `setImmediate` callbacks.'
              stability: development
            - id: tcpserverwrap
              value: 'TCPServerWrap'
              brief: 'Active TCP Servers.'
              stability: development
            - id: tcpwrap
              value: 'TCPWrap'
              brief: 'Active TCP connections.'
              stability: development
            - id: timeout
              value: 'Timeout'
              brief: 'Active `setTimeout` or `setInterval` timers.'
              stability: development
            - id: ttywrap
              value: 'TTYWrap'
              brief: 'Active Terminal I/O (stdin/stdout).'
              stability: development
