  - id: span.dynamodb.getitem.client
    ref: aws.client
    brief: >
      This span represents a `DynamoDB.GetItem` call.
    note: >
      `db.system.name` MUST be set to `"aws.dynamodb"` and SHOULD be provided **at span creation time**.
    stability: development
