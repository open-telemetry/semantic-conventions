# yaml-language-server: $schema=https://raw.githubusercontent.com/open-telemetry/weaver/v0.26.1/schemas/semconv.schema.v2.json
file_format: definition/2

span_refinements:
  - id: span.aws.lambda.server
    ref: faas.server
    annotations:
      compatibility:
        policy_exceptions: [span_missing]
    stability: development
    brief: >
      This span represents AWS Lambda invocation.
    note: |
      Consider setting other attributes of the [`faas` resource][faasres].

      **Span name** MUST be set to the function name from the Lambda `Context`
      unless stated otherwise.

      **Span kind** MUST be `SERVER` unless stated otherwise.
    attributes:
      - ref: aws.lambda.invoked_arn
        requirement_level: recommended
      - ref: aws.lambda.resource_mapping.id
        requirement_level: recommended
      - ref: faas.invocation_id
        brief: The value of the AWS Request ID, which is always available through an accessor on the Lambda `Context`
      - ref: cloud.account.id
        note: "In some languages, this is available as an accessor on the Lambda `Context`. Otherwise, it can be parsed from the ARN as the fifth item when splitting on `:`"
