file_format: definition/2

attribute_groups:
  # Attributes of an individual Kafka message.
  - id: messaging.kafka.attributes.common
    visibility: internal
    attributes:
      - ref: kafka.message.key
        requirement_level:
          recommended: If span describes operation on a single message.
      - ref: kafka.offset
        requirement_level:
          recommended: If span describes operation on a single message.
      - ref: kafka.message.tombstone
        requirement_level:
          conditionally_required: If value is `true`. When missing, the value is assumed to be `false`.

span_refinements:
  - id: kafka.producer.create
    ref: messaging.producer.create
    stability: development
    brief: Describes a message being created for sending to Apache Kafka.
    attributes:
      - ref: messaging.system.name
        annotations:
          markdown:
            omit_enum_table: true
        note: MUST be set to `"kafka"`.
        examples: ['kafka']
      - ref: error.type
        examples: ['UNKNOWN_TOPIC_OR_PARTITION', 'KAFKA_STORAGE_ERROR', 'NOT_ENOUGH_REPLICAS']
      - ref: messaging.destination.name
        examples: ['MyTopic']
      - ref: kafka.message.key
        requirement_level:
          recommended: If span describes operation on a single message.
      - ref: kafka.message.tombstone
        requirement_level:
          conditionally_required: If value is `true`. When missing, the value is assumed to be `false`.

  - id: kafka.producer.send
    ref: messaging.producer.send
    stability: development
    brief: Describes a producer sending one or more messages to Apache Kafka.
    attributes:
      - ref: messaging.system.name
        annotations:
          markdown:
            omit_enum_table: true
        note: MUST be set to `"kafka"`.
        examples: ['kafka']
      - ref: error.type
        examples: ['UNKNOWN_TOPIC_OR_PARTITION', 'KAFKA_STORAGE_ERROR', 'NOT_ENOUGH_REPLICAS']
      - ref: messaging.destination.name
        examples: ['MyTopic']
      - ref: kafka.cluster.id
      - ref: messaging.destination.partition.id
      - ref_group: messaging.kafka.attributes.common

  - id: kafka.client.send
    ref: messaging.client.send
    stability: development
    brief: Describes a producer sending one or more messages to Apache Kafka.
    attributes:
      - ref: messaging.system.name
        annotations:
          markdown:
            omit_enum_table: true
        note: MUST be set to `"kafka"`.
        examples: ['kafka']
      - ref: error.type
        examples: ['UNKNOWN_TOPIC_OR_PARTITION', 'KAFKA_STORAGE_ERROR', 'NOT_ENOUGH_REPLICAS']
      - ref: messaging.destination.name
        examples: ['MyTopic']
      - ref: kafka.cluster.id
      - ref: messaging.destination.partition.id
      - ref_group: messaging.kafka.attributes.common

  - id: kafka.client.receive
    ref: messaging.client.receive
    stability: development
    brief: Describes a consumer receiving one or more messages from Apache Kafka (pull-based).
    attributes:
      - ref: messaging.system.name
        annotations:
          markdown:
            omit_enum_table: true
        note: MUST be set to `"kafka"`.
        examples: ['kafka']
      - ref: error.type
        examples: ['UNKNOWN_TOPIC_OR_PARTITION', 'KAFKA_STORAGE_ERROR', 'NOT_ENOUGH_REPLICAS']
      - ref: messaging.destination.name
        examples: ['MyTopic']
      - ref: messaging.consumer.group.name
        brief: "Kafka [consumer group ID](https://docs.confluent.io/platform/current/clients/consumer.html)."
        note: ""
        requirement_level:
          conditionally_required: If applicable.
        sampling_relevant: true
      - ref: kafka.cluster.id
      - ref: messaging.destination.partition.id
      - ref_group: messaging.kafka.attributes.common

  - id: kafka.client.settle
    ref: messaging.client.settle
    stability: development
    brief: Describes a consumer committing offsets (settling) one or more messages from Apache Kafka.
    attributes:
      - ref: messaging.system.name
        annotations:
          markdown:
            omit_enum_table: true
        note: MUST be set to `"kafka"`.
        examples: ['kafka']
      - ref: error.type
        examples: ['UNKNOWN_TOPIC_OR_PARTITION', 'KAFKA_STORAGE_ERROR', 'NOT_ENOUGH_REPLICAS']
      - ref: messaging.destination.name
        examples: ['MyTopic']
      - ref: messaging.consumer.group.name
        brief: "Kafka [consumer group ID](https://docs.confluent.io/platform/current/clients/consumer.html)."
        note: ""
        requirement_level:
          conditionally_required: If applicable.
        sampling_relevant: true
      - ref: kafka.cluster.id
      - ref: messaging.destination.partition.id
      - ref: kafka.offset
        requirement_level:
          recommended: If span describes operation on a single message.

  - id: kafka.consumer.process
    ref: messaging.consumer.process
    stability: development
    brief: Describes a consumer processing one or more messages from Apache Kafka (push-based).
    attributes:
      - ref: messaging.system.name
        annotations:
          markdown:
            omit_enum_table: true
        note: MUST be set to `"kafka"`.
        examples: ['kafka']
      - ref: error.type
        examples: ['UNKNOWN_TOPIC_OR_PARTITION', 'KAFKA_STORAGE_ERROR', 'NOT_ENOUGH_REPLICAS']
      - ref: messaging.destination.name
        examples: ['MyTopic']
      - ref: messaging.consumer.group.name
        brief: "Kafka [consumer group ID](https://docs.confluent.io/platform/current/clients/consumer.html)."
        note: ""
        requirement_level:
          conditionally_required: If applicable.
        sampling_relevant: true
      - ref: kafka.cluster.id
      - ref: messaging.destination.partition.id
        brief: String representation of the partition ID the message (or batch) is received from.
        requirement_level: recommended
      - ref_group: messaging.kafka.attributes.common
