# yaml-language-server: $schema=https://raw.githubusercontent.com/open-telemetry/weaver/v0.25.1/schemas/semconv.schema.v2.json
file_format: definition/2

entities:
  - type: zos.software
    annotations:
      dependency_resolution:
        exclude: true
    stability: development
    brief: A software resource running on a z/OS system.
    identity:
      - ref: zos.sysplex.name
      - ref: zos.smf.id
      - ref: mainframe.lpar.name

entity_refinements:
  # Refines the generic 'host' entity with z/OS-specific notes for host.name,
  # host.arch, and host.id.
  # All three are descriptive on the base entity (host has no role: identifying
  # attrs in this upstream definition), so all go under description:.
  - id: zos.host
    ref: host
    stability: development
    brief: >
      Refinement of the generic host entity for a z/OS system, providing
      z/OS-specific context for the hostname, architecture, and host identifier.
    description:
      - ref: host.name
        requirement_level: recommended
        brief: 'Name of the host. On z/OS, SHOULD be the fully qualified hostname used to register the z/OS system in DNS.'
        examples: ['SYS1.DOMAIN.COM']
      - ref: host.arch
        requirement_level: recommended
        examples: ['s390x']
      - ref: host.id
        requirement_level: opt_in
        brief: >
          Unique host ID. On z/OS, SHOULD be the concatenation of the sysplex name
          and the SMF system identifier (SMFID), separated by a dash.
        examples: ['SYSPLEX1-SYS1']

  # Refines the generic 'os' entity with z/OS-specific notes for os.type,
  # os.description, os.name, and os.version.
  # All four are descriptive on the base entity.
  - id: zos.os
    ref: os
    stability: development
    brief: >
      Refinement of the generic operating system entity for z/OS, providing
      z/OS-specific context for each OS attribute.
    description:
      - ref: os.type
        requirement_level: required
        examples: ['zos']
      - ref: os.description
        requirement_level: opt_in
        brief: 'Human readable OS version information, e.g., as reported by the z/OS command `d iplinfo`.'
        examples: ['IBM z/OS 3.1']
      - ref: os.name
        requirement_level: opt_in
        examples: ['z/OS']
      - ref: os.version
        requirement_level: opt_in
        brief: 'The version string of the operating system. On z/OS, SHOULD be the release returned by the command `d iplinfo`.'
        examples: ['3.1.0']

  # Refines the generic 'process' entity with z/OS-specific notes.
  # process.pid is role: identifying on the base entity → goes under identity:.
  # process.command and process.owner are role: descriptive → go under description:.
  - id: zos.process
    ref: process
    stability: development
    brief: >
      Refinement of the generic process entity for a z/OS process (address space),
      providing z/OS-specific context for the command name, process identifier,
      and process owner.
    identity:
      - ref: process.pid
        note: >
          On z/OS, SHOULD be set to the Address Space Identifier (ASID), which
          uniquely identifies an address space within a single z/OS image.
          The ASID is typically represented as a four-digit hexadecimal value.
        examples: [2186]
    description:
      - ref: process.command
        requirement_level: recommended
        brief: >
          The command used to launch the process (i.e. the command name). On z/OS,
          SHOULD be set to the name of the job used to start the z/OS system software.
        examples: ['CICSSTRT']
      - ref: process.owner
        requirement_level: opt_in
        note: 'On z/OS, SHOULD be set to the user under which the z/OS system software is executed.'
        examples: ['CICSUSR']

  # Refines the generic 'process.runtime' entity with z/OS-specific examples.
  # process.runtime.name and process.runtime.version are role: identifying
  # on the base entity → go under identity:.
  # process.runtime.description is role: descriptive → goes under description:.
  - id: zos.process.runtime
    ref: process.runtime
    stability: development
    brief: >
      Refinement of the process runtime entity for a z/OS system software
      runtime, providing z/OS-specific examples and context.
    identity:
      - ref: process.runtime.name
        examples: ['CICS Transaction Server z/OS Version 5.6']
      - ref: process.runtime.version
        examples: ['5.6']
    description:
      - ref: process.runtime.description
        requirement_level: opt_in
        examples: ['IBM Customer Information Control System (CICS) Transaction Server for z/OS Version 5.6']

  # Refines the generic 'service' entity with z/OS-specific notes.
  # service.name is role: identifying on the base entity → goes under identity:.
  # service.version is role: descriptive → goes under description:.
  - id: zos.service
    ref: service
    stability: development
    brief: >
      Refinement of the generic service entity for a z/OS system software
      service, providing z/OS-specific context for the service name and version.
    identity:
      - ref: service.name
        note: For z/OS system software, SHOULD be set to an abbreviated name of the z/OS system software.
        examples: ['CICS TS', 'Datacom', 'ADABAS']
    description:
      - ref: service.version
        requirement_level: recommended
        note: For z/OS system software, SHOULD be set to the version of the z/OS system software.
        examples: ['5.6']

  # Refines the generic 'service.instance' entity with z/OS-specific notes.
  # service.instance.id is role: identifying on the base entity → goes under identity:.
  - id: zos.service.instance
    ref: service.instance
    stability: development
    brief: >
      Refinement of the service instance entity for a z/OS system software
      instance, providing z/OS-specific context for the instance identifier.
    identity:
      - ref: service.instance.id
        note: >
          For z/OS system software, SHOULD be set to the identifier representing
          the current instance, e.g., the CICS region APPLID or IMS region IMSID.
        examples: ['CICSPROD']

  # Refines the generic 'service.namespace' entity with z/OS-specific notes.
  # service.namespace is role: identifying on the base entity → goes under identity:.
  - id: zos.service.namespace
    ref: service.namespace
    stability: development
    brief: >
      Refinement of the service namespace entity for a z/OS system software
      grouping, providing z/OS-specific context for the namespace identifier.
    identity:
      - ref: service.namespace
        note: >
          For z/OS system software, SHOULD be set to the identifier representing
          a grouping of z/OS system software instances, e.g., the name of the CICSPLEX.
        examples: ['CICSPLX2']
