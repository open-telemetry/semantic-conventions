groups:
  - id: registry.zos
    type: attribute_group
    display_name: z/OS attributes
    brief: >
      This document defines attributes of a z/OS resource.
    attributes:
      - id: zos.smf.id
        annotations:
          dependency_resolution:
            exclude: true
        type: string
        stability: development
        brief: "The System Management Facility (SMF) identifier that uniquely identifies a z/OS system within a sysplex or mainframe environment and is used for system and performance analysis."
        examples: ["SYS1"]
      - id: zos.sysplex.name
        annotations:
          dependency_resolution:
            exclude: true
        type: string
        stability: development
        brief: "The name of the sysplex to which the z/OS system belongs."
        examples: ["SYSPLEX1"]
