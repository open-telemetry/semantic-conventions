# yaml-language-server: $schema=https://raw.githubusercontent.com/open-telemetry/weaver/v0.25.1/schemas/semconv.schema.v2.json
file_format: definition/2
attribute_groups:
  - id: destination
    visibility: public
    stability: development
    brief: >
      `destination.*` attributes describe the receiver of a network exchange or packet, recorded as
      observed at the point of instrumentation rather than resolved to an identity behind
      intermediaries such as proxies.


      Use them when there is no client/server relationship between the two sides, or when that
      relationship is unknown - for example low-level or packet-level telemetry (packet tracing,
      flow export) where you cannot tell whether a connection exists or which side initiated it,
      unidirectional UDP flows, and peer-to-peer protocols such as gossip, BitTorrent, or blockchain
      node-to-node communication. When the initiator and acceptor
      roles are known, prefer `client.*` / `server.*`.
    attributes:
      - ref: destination.address
      - ref: destination.port
