# yaml-language-server: $schema=https://raw.githubusercontent.com/open-telemetry/weaver/v0.26.1/schemas/semconv.schema.v2.json
file_format: definition/2
attributes:
  - key: destination.address
    type: string
    stability: development
    brief: "Destination address - domain name if available without reverse DNS lookup; otherwise, IP address or UNIX domain socket name."
    note: >
      When observed from the source side, and when communicating through an intermediary, `destination.address` SHOULD represent
      the destination address behind any intermediaries, for example proxies, if it's available.
    examples: ['destination.example.com', '10.1.2.80', '/tmp/my.sock']
  - key: destination.cidr
    type: string
    stability: development
    brief: "The CIDR block associated with the destination IP address."
    note: >
      The value MUST use CIDR notation and the address portion MUST be the canonical
      network address for the prefix, with all host bits set to zero. This attribute MAY
      be set whether or not `destination.address` is set. If `destination.address` is also
      set to an IP address, the IP address MUST be contained in this CIDR block.
    examples: ['192.0.2.0/24', '2001:db8::/32']
  - key: destination.port
    type: int
    stability: development
    brief: 'Destination port number'
    examples: [3389, 2888]
