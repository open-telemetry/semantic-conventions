# yaml-language-server: $schema=https://raw.githubusercontent.com/open-telemetry/weaver/v0.25.1/schemas/semconv.schema.v2.json
file_format: definition/2
attribute_groups:
  - id: cloudevents
    visibility: public
    stability: development
    brief: >
      These attributes can be attached to spans when performing operations with CloudEvents,
      regardless of the protocol being used.
    attributes:
      - ref: cloudevents.event_id
        requirement_level: required
      - ref: cloudevents.event_source
        requirement_level: required
      - ref: cloudevents.event_spec_version
        requirement_level: recommended
      - ref: cloudevents.event_type
        requirement_level: recommended
      - ref: cloudevents.event_subject
        requirement_level: recommended
