# yaml-language-server: $schema=https://raw.githubusercontent.com/open-telemetry/weaver/v0.28.0/schemas/semconv.schema.v2.json
file_format: definition/2
attributes:
  - key: session.id
    deprecated:
      reason: uncategorized
      note: >
        Moved to the [OpenTelemetry Client-Side semantic conventions repository](https://github.com/open-telemetry/semantic-conventions-client-side).
    annotations:
      dependency_resolution:
        exclude: true
    type: string
    stability: development
    brief: "A unique ID to identify a session."
    examples: ['00112233-4455-6677-8899-aabbccddeeff']
  - key: session.previous_id
    deprecated:
      reason: uncategorized
      note: >
        Moved to the [OpenTelemetry Client-Side semantic conventions repository](https://github.com/open-telemetry/semantic-conventions-client-side).
    annotations:
      dependency_resolution:
        exclude: true
    type: string
    stability: development
    brief: "The previous `session.id` for this user, when known."
    examples: ['00112233-4455-6677-8899-aabbccddeeff']
