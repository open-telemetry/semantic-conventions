# yaml-language-server: $schema=https://raw.githubusercontent.com/open-telemetry/weaver/v0.25.1/schemas/semconv.schema.v2.json
file_format: definition/2
attribute_groups:
  - id: server
    visibility: public
    stability: stable
    brief: >
      `server.*` attributes describe the server in a connection-based network interaction: the side
      that accepts the connection (the client is the side that initiates it). They identify the
      logical server the client intended to reach, which - behind proxies or load balancers - can
      differ from the directly connected peer (see `network.peer.*`).


      Use them for interactions with a clear initiator and acceptor. This covers all TCP interactions
      and connection-oriented UDP interactions such as QUIC (HTTP/3) and DNS. It does not cover
      peer-to-peer communication where the protocol or API exposes no clear notion of client and
      server (even over TCP); use `source.*` / `destination.*` there instead.
    attributes:
      - ref: server.address
      - ref: server.port
