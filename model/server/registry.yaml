# yaml-language-server: $schema=https://raw.githubusercontent.com/open-telemetry/weaver/v0.27.0/schemas/semconv.schema.v2.json
file_format: definition/2
attributes:
  - key: server.address
    stability: stable
    type: string
    brief: "Server domain name if available without reverse DNS lookup; otherwise, IP address or UNIX domain socket name."
    note: >
      When observed from the client side, and when communicating through an intermediary, `server.address` SHOULD represent
      the server address behind any intermediaries, for example proxies, if it's available.
    examples: ['example.com', '10.1.2.80', '/tmp/my.sock']
  - key: server.prefix.address
    stability: development
    type: string
    brief: "The network address of the IP prefix associated with the server IP address."
    note: >
      The value MUST be an IPv4 or IPv6 network address, with all host bits set to zero
      according to `server.prefix.length`. IPv4 addresses MUST use dotted-decimal
      notation. IPv6 addresses MUST use the canonical text representation defined in
      [RFC 5952](https://www.rfc-editor.org/rfc/rfc5952.html). The value MUST NOT contain
      a prefix length, domain name, UNIX domain socket name, or IPv6 zone identifier.
      This attribute MUST be set together with `server.prefix.length`. The prefix
      attributes MAY be set whether or not `server.address` is set. If
      `server.address` is also set to an IP address, it MUST use the same IP version
      and be contained in the prefix represented by these two attributes.
    examples: ['192.0.2.0', '2001:db8::']
  - key: server.prefix.length
    stability: development
    type: int
    brief: "The number of leading bits in the IP prefix associated with the server IP address."
    note: >
      The value MUST be an integer from 0 to 32 for IPv4, as defined in
      [RFC 4632](https://www.rfc-editor.org/rfc/rfc4632.html), or from 0 to 128 for IPv6.
      This attribute MUST be set together with `server.prefix.address`.
    examples: [24, 32]
  - key: server.port
    stability: stable
    type: int
    brief: Server port number.
    note: >
      When observed from the client side, and when communicating through an intermediary, `server.port` SHOULD represent
      the server port behind any intermediaries, for example proxies, if it's available.
    examples: [80, 8080, 443]
