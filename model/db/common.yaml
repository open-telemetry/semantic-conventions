file_format: definition/2

attribute_groups:
  - id: db.client.connection
    visibility: internal
    attributes:
      - ref: server.address
        brief: >
          The database address specified in the client configuration.
        note: |
          Instrumentation SHOULD set `server.address` to the database address specified in the client configuration.
          It SHOULD NOT derive the value from the server selected for an operation.

          > [!WARNING]
          >
          > `server.address` MUST NOT contain credentials or other sensitive information.

          See [Database server address](/docs/db/database-spans.md#database-server-address) for guidance and
          examples.
      - ref: server.port
        note: >
          `server.port` SHOULD reflect the database port specified in the client configuration.
          It SHOULD NOT be derived from the server selected for an operation.
        requirement_level:
          conditionally_required: >
            If `server.address` is set and the client is configured with a single database server endpoint
            that uses a non-default port.

  - id: db.network.peer
    visibility: internal
    attributes:
      - ref: network.peer.address
        brief: Peer address of the database node where the operation was performed.
        requirement_level:
          recommended: If applicable for this database system.
        note: >
          Semantic conventions for individual database systems SHOULD document whether `network.peer.*` attributes are applicable.
          Network peer address and port are useful when the application interacts with individual database nodes directly.

          If a database operation involved multiple network calls (for example retries), the address of the last contacted node SHOULD be used.
      - ref: network.peer.port
        requirement_level:
          recommended: If and only if `network.peer.address` is set.
