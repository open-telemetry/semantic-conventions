file_format: definition/2

attribute_groups:
  - id: db.client.connection
    visibility: internal
    attributes:
      - ref: server.address
        brief: >
          The database address specified in the client configuration.
        note: |
          Instrumentation SHOULD set `server.address` to the database address specified in the client configuration.
          It SHOULD NOT derive the value from the server selected for an operation.

          > [!WARNING]
          >
          > `server.address` MUST NOT contain credentials or other sensitive information.

          See [Database server address](/docs/db/database-spans.md#database-server-address) for guidance and
          examples.
      - ref: server.port
        note: >
          `server.port` SHOULD reflect the database port specified in the client configuration.
          It SHOULD NOT be derived from the server selected for an operation.
        requirement_level:
          conditionally_required: >
            If `server.address` is set and the client is configured with a single database server endpoint
            that uses a non-default port.
  - id: db.network.peer
    visibility: internal
    attributes:
      - ref: network.peer.address
        brief: Peer address of the database node where the operation was performed.
        requirement_level:
          recommended: If applicable for this database system.
        note: >
          Semantic conventions for individual database systems SHOULD document whether `network.peer.*` attributes are applicable.
          Network peer address and port are useful when the application interacts with individual database nodes directly.

          If a database operation involved multiple network calls (for example retries), the address of the last contacted node SHOULD be used.
      - ref: network.peer.port
        requirement_level:
          recommended: If and only if `network.peer.address` is set.
  - id: db.operation
    visibility: internal
    attributes:
      - ref: db.operation.batch.size
      - ref: db.operation.name
        requirement_level:
          conditionally_required: If readily available and if there is a single operation name that describes the database call.
        examples: ["findAndModify", "HMSET", "SELECT"]
      - ref: db.namespace
        requirement_level:
          conditionally_required: If available.
      - ref: db.stored_procedure.name
        requirement_level:
          recommended: If operation applies to a specific stored procedure.
      - ref: db.collection.name
        requirement_level:
          conditionally_required: If readily available and if a database call is performed on a single collection.
        note: |
          It is RECOMMENDED to capture the value as provided by the application
          without attempting to do any case normalization.

          The collection name SHOULD NOT be extracted from `db.query.text`,
          when the database system supports query text with multiple collections
          in non-batch operations.

          For batch operations, if the individual operations would all have the same
          `db.collection.name` when executed as non-batch operations,
          then that collection name SHOULD be used.
  - id: db.response
    visibility: internal
    attributes:
      - ref: db.response.status_code
        brief: Database response status code.
        requirement_level:
          conditionally_required: If the operation failed and status code is available.
      - ref: db.response.returned_rows
        note: |
          The number of rows returned by the database operation as observed
          by the instrumentation at the time the span ends.
        # experimental attributes must be opt-in stable spans
        # TODO (@trask) make this recommended once it is stable
        requirement_level: opt_in
      - ref: error.type
        requirement_level:
          conditionally_required: If and only if the operation failed.
        note: >
          The `error.type` SHOULD match the `db.response.status_code` returned by the database or the client library,
          or the canonical name of exception that occurred.

          When using canonical exception type name, instrumentation SHOULD do the best effort to
          report the most relevant type. For example, if the original exception is wrapped into a
          generic one, the original exception SHOULD be preferred.

          Instrumentations SHOULD document how `error.type` is populated.
  - id: db.query
    visibility: internal
    attributes:
      - ref: db.query.text
        requirement_level:
          recommended: >
            Non-parameterized query text SHOULD NOT be collected by default unless there is sanitization that excludes
            sensitive data, e.g. by redacting all literal values present in the query text.
            See [Sanitization of `db.query.text`](/docs/db/database-spans.md#sanitization-of-dbquerytext).

            Parameterized query text SHOULD be collected by default
            (the query parameter values themselves are opt-in,
            see [`db.query.parameter.<key>`](/docs/registry/attributes/db.md)).
      - ref: db.query.summary
        requirement_level:
          recommended: if available through instrumentation hooks or if the instrumentation supports generating a query summary.
      - ref: db.query.parameter
        requirement_level: opt_in
