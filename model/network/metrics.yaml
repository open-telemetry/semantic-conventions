# yaml-language-server: $schema=https://raw.githubusercontent.com/open-telemetry/weaver/v0.28.0/schemas/semconv.schema.v2.json
file_format: definition/2
attribute_groups:
  - id: metric_attributes.network.interface.io
    visibility: internal
    attributes:
      - ref: host.id
        requirement_level: opt_in
        note: >
          Identifies the monitored device, not the collector. Use this data point attribute
          only when the monitored device's ID cannot be reported on the resource.
          Omit this attribute if the monitored device's ID is unavailable.
      - ref: network.interface.name
        requirement_level: required
      - ref: network.io.direction
        requirement_level: required
        examples: ['receive', 'transmit']
        annotations:
          markdown:
            omit_enum_table: true

metrics:
  - name: network.io
    stability: development
    requirement_level: recommended
    brief: The number of bytes received and transmitted by a network interface.
    note: Count bytes at the observed interface layer, including framing bytes where applicable.
    instrument: counter
    unit: 'By'
    entity_associations:
      - host
    annotations:
      code_generation:
        metric_value_type: int
    attributes:
      - ref_group: metric_attributes.network.interface.io

  - name: network.packets
    stability: development
    requirement_level: recommended
    brief: The number of packets transferred or dropped by a network interface.
    note: |
      A transferred packet is one delivered to the next layer on receive or sent by the
      interface on transmit. A dropped packet does not complete that transfer because it was
      discarded or encountered an error. Count each packet once for a given interface and
      direction. Do not map a source counter that mixes both outcomes directly to this metric.
      For example, a transmission-request counter can include unsent packets. Do not use a count
      of error events unless it counts each dropped packet once.

      For transferred packets and dropped packets separately, report either a total or a
      complete, non-overlapping breakdown. Do not report a total alongside a breakdown
      that it includes.
    instrument: counter
    unit: '{packet}'
    entity_associations:
      - host
    annotations:
      code_generation:
        metric_value_type: int
    attributes:
      - ref_group: metric_attributes.network.interface.io
      - ref: network.packet.addressing
        requirement_level:
          conditionally_required: When reporting a breakdown by destination addressing category.
        note: >
          Classify the packet at the observed interface layer, not at an inner encapsulated
          layer. Omit this attribute when reporting the total across all addressing categories.
      - ref: network.packet.drop.reason
        requirement_level:
          conditionally_required: When counting dropped packets.
        note: >
          MUST be omitted for transferred packets. Use `unknown` when the source identifies
          dropped packets but does not report a reason or provides only a total across reasons.
          Use `unknown_protocol` only for receive-side drops.
      - ref: error.type
        requirement_level:
          conditionally_required: When a drop in the `error` category has a known error type.
        note: >
          Use a low-cardinality type for a detected error. MUST NOT be set for transferred
          packets, non-error discards, or a total combining error drops and non-error discards.
        examples: ['crc', 'frame_too_long']

  - name: network.interface.queue.size
    stability: development
    requirement_level: opt_in
    brief: The current number of packets queued on a network interface.
    note: >
      Report the current occupancy, not the cumulative number of packets queued. When polling
      occupancy, use an Asynchronous UpDownCounter. If the source does not expose occupancy,
      omit the measurement instead of reporting zero.
    instrument: updowncounter
    unit: '{packet}'
    entity_associations:
      - host
    annotations:
      code_generation:
        metric_value_type: int
    attributes:
      - ref_group: metric_attributes.network.interface.io
