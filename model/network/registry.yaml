groups:
  - id: registry.network
    type: attribute_group
    display_name: Network Attributes
    brief: >
        These attributes may be used for any network related operation.
    attributes:
      - id: network.carrier.icc
        type: string
        stability: development
        brief: "The ISO 3166-1 alpha-2 2-character country code associated with the mobile carrier network."
        examples: "DE"
      - id: network.carrier.mcc
        type: string
        stability: development
        brief: "The mobile carrier country code."
        examples: "310"
      - id: network.carrier.mnc
        type: string
        stability: development
        brief: "The mobile carrier network code."
        examples: "001"
      - id: network.carrier.name
        type: string
        stability: development
        brief: "The name of the mobile carrier."
        examples: "sprint"
      - id: network.connection.subtype
        type:
          members:
            - id: gprs
              brief: GPRS
              value: "gprs"
              stability: development
            - id: edge
              brief: EDGE
              value: "edge"
              stability: development
            - id: umts
              brief: UMTS
              value: "umts"
              stability: development
            - id: cdma
              brief: CDMA
              value: "cdma"
              stability: development
            - id: evdo_0
              brief: EVDO Rel. 0
              value: "evdo_0"
              stability: development
            - id: evdo_a
              brief: "EVDO Rev. A"
              value: "evdo_a"
              stability: development
            - id: cdma2000_1xrtt
              brief: CDMA2000 1XRTT
              value: "cdma2000_1xrtt"
              stability: development
            - id: hsdpa
              brief: HSDPA
              value: "hsdpa"
              stability: development
            - id: hsupa
              brief: HSUPA
              value: "hsupa"
              stability: development
            - id: hspa
              brief: HSPA
              value: "hspa"
              stability: development
            - id: iden
              brief: IDEN
              value: "iden"
              stability: development
            - id: evdo_b
              brief: "EVDO Rev. B"
              value: "evdo_b"
              stability: development
            - id: lte
              brief: LTE
              value: "lte"
              stability: development
            - id: ehrpd
              brief: EHRPD
              value: "ehrpd"
              stability: development
            - id: hspap
              brief: HSPAP
              value: "hspap"
              stability: development
            - id: gsm
              brief: GSM
              value: "gsm"
              stability: development
            - id: td_scdma
              brief: TD-SCDMA
              value: "td_scdma"
              stability: development
            - id: iwlan
              brief: IWLAN
              value: "iwlan"
              stability: development
            - id: nr
              brief: "5G NR (New Radio)"
              value: "nr"
              stability: development
            - id: nrnsa
              brief: "5G NRNSA (New Radio Non-Standalone)"
              value: "nrnsa"
              stability: development
            - id: lte_ca
              brief: LTE CA
              value: "lte_ca"
              stability: development
        stability: development
        brief: 'This describes more details regarding the connection.type. It may be the type of cell technology connection, but it could be used for describing details about a Wi-Fi connection.'
        examples: 'LTE'
      - id: network.connection.type
        type:
          members:
            - id: wifi
              value: "wifi"
              brief: 'Wi-Fi'
              stability: development
            - id: wired
              value: "wired"
              stability: development
            - id: cell
              value: "cell"
              stability: development
            - id: unavailable
              value: "unavailable"
              stability: development
            - id: unknown
              value: "unknown"
              stability: development
        stability: development
        brief: 'The internet connection type.'
        examples: 'wifi'
      - id: network.local.address
        stability: stable
        type: string
        brief: Local address of the network connection - IP address or UNIX domain socket name.
        examples: ['10.1.2.80', '/tmp/my.sock']
      - id: network.local.port
        stability: stable
        type: int
        brief: Local port number of the network connection.
        examples: [65123]
      - id: network.peer.address
        stability: stable
        type: string
        brief: Peer address of the network connection - IP address or UNIX domain socket name.
        examples: ['10.1.2.80', '/tmp/my.sock']
      - id: network.peer.port
        stability: stable
        type: int
        brief: Peer port number of the network connection.
        examples: [65123]
      - id: network.protocol.name
        stability: stable
        type: string
        brief: '[OSI application layer](https://wikipedia.org/wiki/Application_layer) or non-OSI equivalent.'
        note: The value SHOULD be normalized to lowercase.
        examples: ['amqp', 'http', 'mqtt']
      - id: network.protocol.version
        stability: stable
        type: string
        brief: The actual version of the protocol used for network communication.
        examples: ['1.1', '2']
        note: >
          If protocol version is subject to negotiation (for example using [ALPN](https://www.rfc-editor.org/rfc/rfc7301.html)),
          this attribute SHOULD be set to the negotiated version. If the actual protocol version is not known,
          this attribute SHOULD NOT be set.
      - id: network.transport
        stability: stable
        type:
          members:
            - id: icmp
              value: 'icmp'
              brief: "ICMP (IANA protocol 1)"
              stability: development
            - id: igmp
              value: 'igmp'
              brief: "IGMP (IANA protocol 2)"
              stability: development
            - id: ipv4
              value: 'ipv4'
              brief: "IPv4 encapsulation / IP-in-IP (IANA protocol 4)."
              stability: development
            - id: tcp
              value: 'tcp'
              brief: "TCP (IANA protocol 6)"
              stability: stable
            - id: udp
              value: 'udp'
              brief: "UDP (IANA protocol 17)"
              stability: stable
            - id: dccp
              value: 'dccp'
              brief: "DCCP (IANA protocol 33)"
              stability: development
            - id: ipv6
              value: 'ipv6'
              brief: "IPv6 encapsulation (IANA protocol 41)."
              stability: development
            - id: gre
              value: 'gre'
              brief: "GRE (IANA protocol 47)"
              stability: development
            - id: esp
              value: 'esp'
              brief: "IPsec ESP (IANA protocol 50)"
              stability: development
            - id: ah
              value: 'ah'
              brief: "IPsec AH (IANA protocol 51)"
              stability: development
            - id: ipv6_icmp
              value: 'ipv6-icmp'
              brief: "ICMPv6 (IANA protocol 58, keyword IPv6-ICMP)"
              stability: development
            - id: eigrp
              value: 'eigrp'
              brief: "EIGRP (IANA protocol 88)"
              stability: development
            - id: ospfigp
              value: 'ospfigp'
              brief: "OSPF (IANA protocol 89, keyword OSPFIGP)"
              stability: development
            - id: pim
              value: 'pim'
              brief: "PIM (IANA protocol 103)"
              stability: development
            - id: vrrp
              value: 'vrrp'
              brief: "VRRP (IANA protocol 112)"
              stability: development
            - id: sctp
              value: 'sctp'
              brief: "SCTP (IANA protocol 132)"
              stability: development
            - id: pipe
              value: "pipe"
              brief: 'Named or anonymous pipe. Not IANA protocol 131 (Private IP Encapsulation within IP).'
              stability: stable
            - id: unix
              value: 'unix'
              brief: "UNIX domain socket"
              stability: stable
            - id: quic
              value: 'quic'
              brief: "QUIC transport protocol. Not an IANA protocol number; QUIC typically runs over UDP."
              stability: stable
        brief: >
          [OSI transport layer](https://wikipedia.org/wiki/Transport_layer),
          [IANA protocol number](https://www.iana.org/assignments/protocol-numbers)
          keyword for IP packets, or
          [inter-process communication method](https://wikipedia.org/wiki/Inter-process_communication).
        note: |
          The value SHOULD be normalized to lowercase.

          For IP packets, well-known values are IANA protocol-number
          keywords, lowercased
          ([Assigned Internet Protocol Numbers](https://www.iana.org/assignments/protocol-numbers))
          from the IPv4 `Protocol` or IPv6 `Next Header` field. `ipv4` and
          `ipv6` mean IP-in-IP encapsulation, not `network.type`. `pipe`,
          `unix`, and `quic` are not IANA protocol numbers.

          Consider always setting the transport when setting a port number, since
          a port number is ambiguous without knowing the transport. For example
          different processes could be listening on TCP port 12345 and UDP port 12345.

          If the instrumentation unwraps IP-in-IP, GRE, or ESP, it SHOULD set
          `network.transport` to the inner protocol. Otherwise it MAY emit
          `ipv4`, `ipv6`, `gre`, or `esp`.
        examples: ['tcp', 'udp', 'icmp']
      - id: network.type
        stability: stable
        type:
          members:
            - id: ipv4
              value: 'ipv4'
              brief: "IPv4 (EtherType 0x0800)"
              stability: stable
            - id: arp
              value: 'arp'
              brief: "Address Resolution Protocol (ARP). EtherType 0x0806."
              stability: development
            - id: ethernet
              value: 'ethernet'
              brief: "Transparent Ethernet Bridging. EtherType 0x6558."
              stability: development
            - id: vlan
              value: 'vlan'
              brief: "IEEE 802.1Q Customer VLAN Tag (C-Tag). EtherType 0x8100."
              stability: development
            - id: ipv6
              value: 'ipv6'
              brief: "IPv6 (EtherType 0x86DD)"
              stability: stable
            - id: qinq
              value: 'qinq'
              brief: "IEEE 802.1ad / 802.1Q Service VLAN Tag (S-Tag). EtherType 0x88A8."
              stability: development
            - id: macsec
              value: 'macsec'
              brief: "IEEE 802.1AE MACsec. EtherType 0x88E5."
              stability: development
            - id: pbb
              value: 'pbb'
              brief: "Provider Backbone Bridging instance tag. EtherType 0x88E7."
              stability: development
            - id: mvrp
              value: 'mvrp'
              brief: "Multiple VLAN Registration Protocol (MVRP). EtherType 0x88F5."
              stability: development
            - id: fibre_channel
              value: 'fibre_channel'
              brief: "Fibre Channel over Ethernet (FCoE). EtherType 0x8906."
              stability: development
            - id: roce
              value: 'roce'
              brief: "RDMA over Converged Ethernet (RoCE). EtherType 0x8915."
              stability: development
            - id: loopback
              value: 'loopback'
              brief: "Loopback. EtherType 0x9000."
              stability: development
        brief: >
          [EtherType](https://wikipedia.org/wiki/EtherType) of the observed frame,
          or [OSI network layer](https://wikipedia.org/wiki/Network_layer) / non-OSI
          equivalent for non-Ethernet networks.
        note: |
          The value SHOULD be normalized to lowercase.

          Well-known values are IEEE 802 EtherTypes. See
          [IANA IEEE 802 Numbers](https://www.iana.org/assignments/ieee-802-numbers#ieee-802-numbers-1).
          An EtherType may name an L2 encapsulation (`vlan`) or an L3 payload
          (`ipv4`).

          If the instrumentation unwraps L2 encapsulations (`vlan`, `qinq`,
          `macsec`, `pbb`), it SHOULD set `network.type` to the inner EtherType.
          Otherwise it MAY emit the encapsulation type.

          `ipv4` and `ipv6` here are EtherTypes, not IANA protocol numbers.
        examples: ['ipv4', 'ipv6', 'arp']
      - id: network.io.direction
        type:
          members:
            - id: transmit
              value: 'transmit'
              stability: release_candidate
            - id: receive
              value: 'receive'
              stability: release_candidate
        stability: release_candidate
        brief: >
          The direction of traffic from the perspective of the observing host's physical or virtual network interface.
          It should not be used to represent the logical direction of a stateful connection or network flow.
        examples: ["transmit"]
      - id: network.interface.name
        type: string
        brief: 'The network interface name.'
        examples: [ 'lo', 'eth0' ]
        stability: release_candidate
      - id: network.connection.state
        type:
          members:
            - id: closed
              value: 'closed'
              stability: development
            - id: close_wait
              value: 'close_wait'
              stability: development
            - id: closing
              value: 'closing'
              stability: development
            - id: established
              value: 'established'
              stability: development
            - id: fin_wait_1
              value: 'fin_wait_1'
              stability: development
            - id: fin_wait_2
              value: 'fin_wait_2'
              stability: development
            - id: last_ack
              value: 'last_ack'
              stability: development
            - id: listen
              value: 'listen'
              stability: development
            - id: syn_received
              value: 'syn_received'
              stability: development
            - id: syn_sent
              value: 'syn_sent'
              stability: development
            - id: time_wait
              value: 'time_wait'
              stability: development
        stability: development
        brief: "The state of network connection"
        note: "Connection states are defined as part of the [rfc9293](https://datatracker.ietf.org/doc/html/rfc9293#section-3.3.2)"
        examples: [ "close_wait" ]
