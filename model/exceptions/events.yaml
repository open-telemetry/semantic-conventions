# yaml-language-server: $schema=https://raw.githubusercontent.com/open-telemetry/weaver/v0.26.1/schemas/semconv.schema.v2.json
file_format: definition/2
events:
  - name: exception
    annotations:
      ocsf_bridge:
        category: Application
        type: Application Activity
        action: Alert
    stability: stable
    brief: >
      This event describes a single exception.
    attributes:
      - ref_group: exception
      - ref: exception.escaped
