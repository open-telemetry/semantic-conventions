groups:
  - id: event.otel.sdk.component.shutdown
    type: event
    name: otel.sdk.component.shutdown
    stability: development
    brief: >
      Indicates that an OpenTelemetry SDK component's shutdown attempt has ended,
      whether by completing successfully, failing, or timing out.
    note: |
      **Applicability.**

      This event SHOULD be emitted by each SDK provider instance
      (`TracerProvider`, `LoggerProvider`, `MeterProvider`) when its shutdown
      operation completes.

      **Emission rules.**

      Implementations MUST NOT emit more than one
      `otel.sdk.component.shutdown` event per provider instance.

      If the process terminates without invoking the provider's shutdown
      (e.g. a crash, `SIGKILL`, container eviction, or immediate process
      termination), no event is expected. Consumers MUST NOT interpret the
      absence of this event as evidence of a clean shutdown.

      The event timestamp MUST be set to the time at which the provider's
      shutdown attempt ended, whether it completed successfully, failed, or
      timed out. This includes the time spent shutting down all child
      components. When `otel.component.shutdown.duration` is present, the
      start of the shutdown attempt can be reconstructed as
      `timestamp - duration`.

      **Severity.**

      Implementations MUST set the log record severity to `WARN`
      (`SeverityNumber` = `13`) when `error.type` is present, and to `INFO`
      (`SeverityNumber` = `9`) otherwise.
    attributes:
      - ref: otel.component.type
        requirement_level: required
        brief: >
          The provider type.
        examples: ["logger_provider", "tracer_provider", "meter_provider"]
      - ref: otel.component.name
        requirement_level: required
      - ref: error.type
        requirement_level:
          conditionally_required: if the shutdown was not successful.
        brief: >
          Describes the class of error that caused the shutdown to fail.
        note: |
          Implementations MUST set `error.type` to `timeout` when both
          conditions are observed (e.g. the shutdown budget expired while a
          child component was still flushing).

          Documented values for this event:

          | Value | Description |
          | --- | --- |
          | `timeout` | The configured shutdown budget expired before all child components completed. |
          | `failed` | One or more child components reported failure within the time budget. |
        examples: ["timeout", "failed"]
      - ref: otel.component.shutdown.duration
        requirement_level: recommended
        brief: >
          The wall-clock elapsed time of the shutdown attempt, in seconds.
          Combined with the event timestamp, this lets consumers compute when
          the shutdown attempt started.
