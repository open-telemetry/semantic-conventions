groups:
  - id: registry.synthetic
    type: attribute_group
    display_name: Synthetic Attributes
    brief: "Describes telemetry generated by synthetic sources such as tests or bots."
    attributes:
      - id: synthetic.type
        stability: development
        brief: >
          Specifies the category of synthetic traffic, such as tests or bots.
        note: >
          Components that populate the attribute are responsible for determining what they consider to be synthetic bot
          or test traffic. This attribute can either be set for self-identification purposes, or on telemetry detected
          to be generated as a result of a synthetic request. This attribute is useful for distinguishing between
          genuine client traffic and synthetic traffic generated by bots or tests.


          The attribute is not limited to a specific protocol: it applies to any telemetry that is known to originate
          from a synthetic source, including telemetry that is produced downstream of the synthetic request.
          For HTTP, this attribute MAY be derived from the contents of the `user_agent.original` attribute.
        type:
          members:
            - id: bot
              value: "bot"
              brief: 'Bot source.'
              stability: development
            - id: test
              value: "test"
              brief: 'Synthetic test source.'
              stability: development
