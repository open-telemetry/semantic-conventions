groups:
  - id: registry.rpc
    type: attribute_group
    display_name: Remote Procedure Call (RPC) Attributes
    brief: 'This document defines attributes for remote procedure calls.'
    attributes:
      - id: rpc.status_code
        type: string
        stability: release_candidate
        brief: Status code of the RPC returned by the RPC server or generated by the client
        note: >
          Usually it represents an error code, but may also represent partial success,
          warning, or differentiate between various types of successful outcomes.

          Semantic conventions for individual RPC frameworks SHOULD document what
          `rpc.status_code` means in the context of that system and which values
          are considered to represent errors.
        examples: ["OK", "DEADLINE_EXCEEDED", "-32602"]
      - id: rpc.request.header
        type: template[string[]]
        stability: development
        brief: >
          RPC request headers or metadata, `<key>` being the normalized header name (lowercase),
          the value being the values.
        note: |
          Instrumentations SHOULD require an explicit configuration of which headers are to be captured.
          Including all request headers can be a security risk - explicit configuration helps avoid leaking sensitive information.

          For example, a header `my-custom-key` with value `["1.2.3.4", "1.2.3.5"]` SHOULD be recorded as
          `rpc.request.header.my-custom-key` attribute with value `["1.2.3.4", "1.2.3.5"]`

          The attribute value MUST consist of either multiple header values as an array of
          strings or a single-item array containing a possibly comma-concatenated string,
          depending on the way the RPC library provides access to metadata.

          Values that the RPC system exposes as binary data, or that are otherwise not valid
          UTF-8 strings, SHOULD be recorded base64-encoded. In gRPC and compatible protocols
          such as Connect RPC and Dubbo Triple, binary values are the ones under keys ending
          in [`-bin`](https://github.com/grpc/grpc/blob/v1.75.0/doc/PROTOCOL-HTTP2.md#requests).
        examples: [["1.2.3.4", "1.2.3.5"]]
      - id: rpc.response.header
        type: template[string[]]
        stability: development
        brief: >
          RPC response headers or metadata sent before the response payload, `<key>` being the
          normalized header name (lowercase), the value being the values.
        note: |
          Instrumentations SHOULD require an explicit configuration of which headers are to be captured.
          Including all response headers can be a security risk - explicit configuration helps avoid leaking sensitive information.

          For example, a header `my-custom-key` with value `["attribute_value"]` SHOULD be recorded as
          the `rpc.response.header.my-custom-key` attribute with value `["attribute_value"]`

          The attribute value MUST consist of either multiple header values as an array of
          strings or a single-item array containing a possibly comma-concatenated string,
          depending on the way the RPC library provides access to metadata.

          Values that the RPC system exposes as binary data, or that are otherwise not valid
          UTF-8 strings, SHOULD be recorded base64-encoded. In gRPC and compatible protocols
          such as Connect RPC and Dubbo Triple, binary values are the ones under keys ending
          in [`-bin`](https://github.com/grpc/grpc/blob/v1.75.0/doc/PROTOCOL-HTTP2.md#requests).

          RPC systems may support response headers, response trailers, or both. Semantic conventions
          for individual RPC systems SHOULD document how system-specific response properties map
          onto response headers.
        examples: [["attribute_value"]]
      - id: rpc.response.trailer
        type: template[string[]]
        stability: development
        brief: >
          RPC response trailers or metadata sent after the response payload, `<key>` being the
          normalized trailer name (lowercase), the value being the values.
        note: |
          Instrumentations SHOULD require an explicit configuration of which trailers are to be captured.
          Including all response trailers can be a security risk - explicit configuration helps avoid leaking sensitive information.

          For example, a trailer `my-custom-key` with value `["attribute_value"]` SHOULD be recorded as
          the `rpc.response.trailer.my-custom-key` attribute with value `["attribute_value"]`

          The attribute value MUST consist of either multiple trailer values as an array of
          strings or a single-item array containing a possibly comma-concatenated string,
          depending on the way the RPC library provides access to metadata.

          Values that the RPC system exposes as binary data, or that are otherwise not valid
          UTF-8 strings, SHOULD be recorded base64-encoded. In gRPC and compatible protocols
          such as Connect RPC and Dubbo Triple, binary values are the ones under keys ending
          in [`-bin`](https://github.com/grpc/grpc/blob/v1.75.0/doc/PROTOCOL-HTTP2.md#requests).

          RPC systems may support response headers, response trailers, or both. Semantic conventions
          for individual RPC systems SHOULD document how system-specific response properties map
          onto response trailers.
        examples: [["attribute_value"]]
      - id: rpc.method
        type: string
        stability: release_candidate
        brief: The fully-qualified logical name of the method from the RPC
          interface perspective.
        examples:
          - "com.example.ExampleService/exampleMethod"
          - "EchoService/Echo"
          - "_OTHER"
        note: |
          The method name MAY have unbounded cardinality in edge or error cases.

          Some RPC frameworks or libraries provide a fixed set of recognized methods
          for client stubs and server implementations. Instrumentations for such
          frameworks MUST set this attribute to the original method name only
          when the method is recognized by the framework or library.

          When the method is not recognized, for example, when the server receives
          a request for a method that is not predefined on the server, or when
          instrumentation is not able to reliably detect if the method is predefined,
          the attribute MUST be set to `_OTHER`.

          If the RPC instrumentation could end up converting valid RPC methods to
          `_OTHER`, then it SHOULD provide a way to configure the list of recognized
          RPC methods.

          The `rpc.method` can be different from the name of any implementing
          method/function.
          The `code.function.name` attribute may be used to record the fully-qualified
          method actually executing the call on the server side, or the
          RPC client stub method on the client side.
      - id: rpc.method_original
        type: string
        stability: release_candidate
        brief: >
          The original name of the method used by the client.
        examples:
          - "com.myservice.EchoService/catchAll"
          - "com.myservice.EchoService/unknownMethod"
          - "InvalidMethod"
      - id: rpc.system.name
        brief: 'The Remote Procedure Call (RPC) system.'
        note: >
          The client and server RPC systems may differ for the same RPC interaction.
          For example, a client may use Apache Dubbo or Connect RPC to communicate
          with a server that uses gRPC since both protocols provide compatibility
          with gRPC.
        type:
          members:
            - id: grpc
              value: 'grpc'
              brief: '[gRPC](https://grpc.io/)'
              stability: release_candidate
            - id: dubbo
              value: 'dubbo'
              brief: '[Apache Dubbo](https://dubbo.apache.org/)'
              stability: release_candidate
            - id: connectrpc
              value: 'connectrpc'
              brief: '[Connect RPC](https://connectrpc.com/)'
              stability: development
            - id: jsonrpc
              value: 'jsonrpc'
              brief: '[JSON-RPC](https://www.jsonrpc.org/)'
              stability: development
        stability: release_candidate
