# yaml-language-server: $schema=https://raw.githubusercontent.com/open-telemetry/weaver/v0.26.1/schemas/semconv.schema.v2.json
file_format: definition/2
metric_refinements:
  - id: metric.rpc.dubbo.server.call.duration
    ref: rpc.server.call.duration
    brief: Measures the duration of an incoming Dubbo call.
    note: |
      When this metric is reported alongside an RPC server span, the metric value
      SHOULD be the same as the RPC server span duration.

      `rpc.system.name` MUST be set to `"dubbo"`.
    attributes:
      - ref: rpc.system.name
        note: "MUST be set to `dubbo`."
        examples: ["dubbo"]
      - ref: rpc.status_code
        requirement_level: required
        brief: >
          The string representation of the Dubbo response status code returned by the server.
        examples: ["OK", "SERVER_ERROR", "SERVER_THREADPOOL_EXHAUSTED_ERROR"]
        note: |
          For Dubbo2, the following status codes SHOULD be considered errors:

          - `SERVER_ERROR`
          - `SERVER_THREADPOOL_EXHAUSTED_ERROR`
          - `SERVER_TIMEOUT`
          - `SERVICE_ERROR`

          For Dubbo3 Triple protocol, the following status codes SHOULD be considered errors:

          - `DATA_LOSS`
          - `DEADLINE_EXCEEDED`
          - `INTERNAL`
          - `UNAVAILABLE`
          - `UNIMPLEMENTED`
          - `UNKNOWN`

          Status codes reference:

          - Dubbo2: [Dubbo2 Protocol Status Codes](https://dubbo.apache.org/en/overview/reference/protocols/tcp/#protocol-specification)
          - Dubbo3 Triple protocol: [Triple Protocol Error Codes](https://dubbo.apache.org/en/overview/reference/protocols/triple-spec/#311-request)
      - ref: error.type
        note: |
          If the RPC fails with an error before status code is returned,
          `error.type` SHOULD be set to the exception type (its fully-qualified class name, if applicable)
          or a component-specific, low cardinality error identifier.

          If a status code is returned and it indicates an error,
          `error.type` SHOULD be set to that status code. See the `rpc.status_code`
          attribute for the list of Dubbo status codes that are considered errors.

          The `error.type` value SHOULD be predictable and SHOULD have low cardinality.
          Instrumentations SHOULD document the list of errors they report.

          If the request has completed successfully, instrumentations SHOULD NOT set
          `error.type`.
        examples:
          - "SERVER_ERROR"
          - "SERVER_THREADPOOL_EXHAUSTED_ERROR"
          - "SERVER_TIMEOUT"
          - "SERVICE_ERROR"
          - "DATA_LOSS"
          - "DEADLINE_EXCEEDED"
          - "INTERNAL"
          - "UNAVAILABLE"
          - "UNIMPLEMENTED"
          - "UNKNOWN"

  - id: metric.rpc.dubbo.client.call.duration
    ref: rpc.client.call.duration
    brief: Measures the duration of an outgoing Dubbo call.
    note: |
      When this metric is reported alongside an RPC client span, the metric value
      SHOULD be the same as the RPC client span duration.

      `rpc.system.name` MUST be set to `"dubbo"`.
    attributes:
      - ref: rpc.system.name
        note: "MUST be set to `dubbo`."
        examples: ["dubbo"]
      - ref: rpc.method
        requirement_level: required
      - ref: rpc.status_code
        requirement_level: required
        brief: >
          The string representation of the Dubbo response status code returned by the server or generated by the client.
        examples: ["OK", "DEADLINE_EXCEEDED", "SERVER_ERROR"]
        note: |
          All status codes except `OK` SHOULD be considered errors.

          Status codes reference:

          - Dubbo2: [Dubbo2 Protocol Status Codes](https://dubbo.apache.org/en/overview/reference/protocols/tcp/#protocol-specification)
          - Dubbo3 Triple protocol: [Triple Protocol Error Codes](https://dubbo.apache.org/en/overview/reference/protocols/triple-spec/#311-request)
      - ref: error.type
        note: |
          If the RPC fails with an error before status code is returned,
          `error.type` SHOULD be set to the exception type (its fully-qualified class name, if applicable)
          or a component-specific, low cardinality error identifier.

          If a status code is returned and it indicates an error,
          `error.type` SHOULD be set to that status code. See the `rpc.status_code`
          attribute for the list of Dubbo status codes that are considered errors.

          The `error.type` value SHOULD be predictable and SHOULD have low cardinality.
          Instrumentations SHOULD document the list of errors they report.

          If the request has completed successfully, instrumentations SHOULD NOT set
          `error.type`.
        examples: ["DEADLINE_EXCEEDED", "SERVER_ERROR"]
      - ref: server.address
        requirement_level:
          conditionally_required: If available.
        examples:
          - "192.168.1.100"
          - "api.example.com"
          - "zookeeper://127.0.0.1:2181/com.example.HelloService:1.0.0:testGroup"
        note: |
          Instrumentations SHOULD populate `server.address` (and `server.port`, when applicable)
          based on the configuration used when creating the Dubbo client and
          SHOULD NOT use actual network-level connection information for this purpose
          to ensure low cardinality.

          For direct connection, when the consumer is configured with an explicit
          provider target URL, instrumentations SHOULD parse `server.address` and
          `server.port` from that URL.

          For service discovery through a registry, instrumentations SHOULD set
          `server.address` to the service-discovery target and SHOULD NOT set
          `server.port`. The service-discovery target is:

          `{registry-protocol}://{registry-host}:{registry-port}/{logical-service-target}`

          The `{registry-port}` component is part of the registry endpoint in
          the service-discovery target and SHOULD NOT be recorded as
          `server.port`, because it is not the network transport port used for
          Dubbo RPC communication.

          It is composed of two parts separated by the `/` between the registry endpoint and logical service target:

          - Registry endpoint: `{registry-protocol}://{registry-host}:{registry-port}`
          - Logical service target: `{interface}[:{version}][:{group}]`, derived from
            the consumer URL, where:
            - `{interface}` is the service interface name from the consumer URL.
            - `{version}` is the `version` URL parameter, if set.
            - `{group}` is the `group` URL parameter, if set.
            - When only `{group}` is set, the format is `{interface}::{group}`.

          Examples:

          Direct connection:

          - Given the target URL `dubbo://192.168.1.100:20880/com.example.DemoService`, expected attributes:
            - `server.address`: `"192.168.1.100"`
            - `server.port`: `20880`
          - Given the target URL `tri://api.example.com:50051/com.example.GreeterService`, expected attributes:
            - `server.address`: `"api.example.com"`
            - `server.port`: `50051`
          - Given the target URL `tri://api.example.com/com.example.GreeterService` (port not specified), expected attributes:
            - `server.address`: `"api.example.com"`
            - `server.port`: not set

          Service discovery (registry):

          - Given a consumer that discovers providers via ZooKeeper for `com.example.HelloService` with `version=1.0.0` and `group=testGroup`, expected attributes:
            - Service-discovery target: `"zookeeper://127.0.0.1:2181/com.example.HelloService:1.0.0:testGroup"`
            - `server.address`: `"zookeeper://127.0.0.1:2181/com.example.HelloService:1.0.0:testGroup"`
            - `server.port`: not set
          - Given a consumer that discovers providers via Nacos for `com.example.HelloService` with `group=gray` (no version), expected attributes:
            - Service-discovery target: `"nacos://127.0.0.1:8848/com.example.HelloService::gray"`
            - `server.address`: `"nacos://127.0.0.1:8848/com.example.HelloService::gray"`
            - `server.port`: not set

          When the address is an IP address, instrumentations SHOULD NOT do a
          reverse DNS lookup to obtain a DNS name and SHOULD set `server.address`
          to the IP address provided.
      - ref: server.port
        requirement_level:
          conditionally_required: If `server.address` is set and if the port is supported by the network transport used for communication.
        note: >
          See the `server.address` for details on parsing the target string.
        examples: [20880, 50051]
