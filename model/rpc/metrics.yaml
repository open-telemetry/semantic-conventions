groups:
  - id: attributes.metrics.rpc.client
    type: attribute_group
    brief: "RPC client metric attributes."
    extends: common.rpc.attributes
    attributes:
      - ref: rpc.system.name
        requirement_level: required
      - ref: server.address
      - ref: server.port
      - ref: rpc.method
        requirement_level:
          conditionally_required: if available.

  - id: attributes.metrics.rpc.server
    type: attribute_group
    brief: "RPC server metric attributes."
    extends: attributes.metrics.rpc.client
    attributes:
      - ref: server.address
        requirement_level: opt_in
        note: >
          `server.address` and `server.port` describe the address the client
          used to reach this server, as reported by the transport or RPC
          framework. Instrumentations SHOULD NOT use actual network-level
          connection information to populate these attributes. If the address
          used by the client is unavailable, instrumentations SHOULD NOT set
          these attributes.
      - ref: server.port
        requirement_level: opt_in

  # RPC Server metrics
  - id: metric.rpc.server.call.duration
    type: metric
    metric_name: rpc.server.call.duration
    annotations:
      code_generation:
        metric_value_type: double
    stability: release_candidate
    brief: Measures the duration of an incoming Remote Procedure Call (RPC).
    instrument: histogram
    unit: "s"
    note: |
      When this metric is reported alongside an RPC server span, the metric value
      SHOULD be the same as the RPC server span duration.

    extends: attributes.metrics.rpc.server

  # RPC Client metrics
  - id: metric.rpc.client.call.duration
    type: metric
    metric_name: rpc.client.call.duration
    annotations:
      code_generation:
        metric_value_type: double
    stability: release_candidate
    brief: Measures the duration of an outgoing Remote Procedure Call (RPC).
    instrument: histogram
    unit: "s"
    note: |
      When this metric is reported alongside an RPC client span, the metric value
      SHOULD be the same as the RPC client span duration.
    extends: attributes.metrics.rpc.client
