# yaml-language-server: $schema=https://raw.githubusercontent.com/open-telemetry/weaver/v0.25.1/schemas/semconv.schema.v2.json
file_format: definition/2
attribute_groups:
  - id: rpc.grpc.attributes.common
    visibility: internal
    attributes:
      - ref: rpc.system.name
        note: "MUST be set to `grpc`."
        examples: ["grpc"]
      - ref: error.type
        examples: ["UNKNOWN", "DEADLINE_EXCEEDED", "UNIMPLEMENTED", "INTERNAL", "UNAVAILABLE", "DATA_LOSS"]

  - id: rpc.grpc.attributes.client
    visibility: internal
    attributes:
      - ref: rpc.method
        requirement_level: required
      - ref: rpc.status_code
        requirement_level: required
        brief: >
          The string representation of the [status code](https://github.com/grpc/grpc/blob/v1.75.0/doc/statuscodes.md)
          returned by the server or generated by the client.
        examples: ["OK", "DEADLINE_EXCEEDED", "UNAVAILABLE"]
        note: |
          All status codes except `OK` SHOULD be considered errors.

          Instrumentations MAY use additional context or provide configuration options to customize
          which status codes are considered errors.
      - ref: server.address
        requirement_level: required
        note: |
          Instrumentations SHOULD populate `server.address` (along with `server.port`)
          based on the configuration used when creating the gRPC channel and
          SHOULD NOT use actual network-level connection information for this purpose
          to ensure low cardinality.

          Instrumentations MAY parse address and port from the gRPC target string
          according to the [gRPC Name Resolution specification](https://grpc.github.io/grpc/core/md_doc_naming.html),
          depending on the scheme used. Or, they MAY use gRPC client APIs that
          provide this information.

          If the instrumentation cannot determine a server domain name or another
          suitable low-cardinality identifier for a group of server instances
          from the target string, it SHOULD set `server.address` to the entire
          target string and SHOULD NOT set `server.port`.

          When the address is an IP address, instrumentations SHOULD NOT do a
          reverse DNS lookup to obtain a DNS name and SHOULD set `server.address`
          to the IP address provided.

          Examples:

          - Given the target string `grpc.io:50051`, expected attributes:
            - `server.address`: `"grpc.io"`
            - `server.port`: `50051`
          - Given the target string `dns://1.2.3.4/grpc.io:50051`, expected attributes:
            - `server.address`: `"grpc.io"`
            - `server.port`: `50051`
          - Given the target string `unix:///run/containerd/containerd.sock`, expected attributes:
            - `server.address`: `"/run/containerd/containerd.sock"`
            - `server.port`: not set
          - Given the target string `zk://zookeeper:2181/my-server`, expected attributes:
            - `server.address`: `"zk://zookeeper:2181/my-server"`
            - `server.port`: not set
          - Given the target string `ipv4:198.51.100.123:50051,198.51.100.124:50051`, expected attributes:
            - `server.address`: `"ipv4:198.51.100.123:50051,198.51.100.124:50051"`
            - `server.port`: not set
      - ref: server.port
        requirement_level:
          conditionally_required: If and only if the port is available and `server.address` is set.
        note: >
          See the `server.address` for details on parsing the target string.
        examples: [50051]

  - id: rpc.grpc.attributes.server
    visibility: internal
    attributes:
      - ref: rpc.status_code
        requirement_level: required
        brief: >
          The string representation of the [status code](https://github.com/grpc/grpc/blob/v1.75.0/doc/statuscodes.md)
          returned by the server.
        examples: ["OK", "DEADLINE_EXCEEDED", "UNAVAILABLE"]
        note: |
          The following status codes SHOULD be considered errors:

          - `UNKNOWN`
          - `DEADLINE_EXCEEDED`
          - `UNIMPLEMENTED`
          - `INTERNAL`
          - `UNAVAILABLE`
          - `DATA_LOSS`

          Instrumentations MAY use additional context or provide configuration options to customize
          which status codes are considered errors.
      - ref: server.address
        note: |
          Instrumentations SHOULD populate `server.address` from the host
          component of the HTTP/2 `:authority` pseudo-header the client used to
          reach this server.

          Instrumentations SHOULD NOT use actual network-level connection
          information for this purpose.
      - ref: server.port
        note: |
          Instrumentations SHOULD populate `server.port` from the port
          component of the HTTP/2 `:authority` pseudo-header the client used to
          reach this server.

          Instrumentations SHOULD NOT use actual network-level connection
          information for this purpose.
        examples: [50051]

  - id: rpc.grpc.attributes.span
    visibility: internal
    attributes:
      - ref: rpc.request.header
        requirement_level: opt_in
        brief: gRPC request headers, also called [request metadata](https://grpc.io/docs/guides/metadata/).
        note: |
          `<key>` is the normalized header name (lowercase), the value is the header values.

          Instrumentations SHOULD require an explicit configuration of which headers are to be
          captured. Capturing all of them can be a security risk - explicit configuration helps
          avoid leaking sensitive information.

          For example, a header `my-custom-key` with value `["1.2.3.4", "1.2.3.5"]` SHOULD be recorded
          as the `rpc.request.header.my-custom-key` attribute with value `["1.2.3.4", "1.2.3.5"]`.

          The attribute value MUST consist of either multiple values as an array of strings or a
          single-item array containing a possibly comma-concatenated string, depending on the way
          the RPC library provides access to headers.

          Values under keys ending in [`-bin`](https://github.com/grpc/grpc/blob/v1.75.0/doc/PROTOCOL-HTTP2.md#requests) are binary and SHOULD be
          base64-encoded when recorded.
      - ref: rpc.response.header
        requirement_level: opt_in
        brief: gRPC response headers, also called [initial metadata](https://grpc.io/docs/what-is-grpc/core-concepts/#rpc-life-cycle).
        note: |
          `<key>` is the normalized header name (lowercase), the value is the header values.

          Instrumentations SHOULD require an explicit configuration of which headers are to be
          captured. Capturing all of them can be a security risk - explicit configuration helps
          avoid leaking sensitive information.

          For example, a header `my-custom-key` with value `["attribute_value"]` SHOULD be recorded
          as the `rpc.response.header.my-custom-key` attribute with value `["attribute_value"]`.

          The attribute value MUST consist of either multiple values as an array of strings or a
          single-item array containing a possibly comma-concatenated string, depending on the way
          the RPC library provides access to headers.

          Values under keys ending in [`-bin`](https://github.com/grpc/grpc/blob/v1.75.0/doc/PROTOCOL-HTTP2.md#requests) are binary and SHOULD be
          base64-encoded when recorded.
      - ref: rpc.response.trailer
        requirement_level: opt_in
        brief: gRPC response trailers, also called [trailing metadata](https://grpc.io/docs/what-is-grpc/core-concepts/#rpc-life-cycle).
        note: |
          `<key>` is the normalized trailer name (lowercase), the value is the trailer values.

          Instrumentations SHOULD require an explicit configuration of which trailers are to be
          captured. Capturing all of them can be a security risk - explicit configuration helps
          avoid leaking sensitive information.

          For example, a trailer `my-custom-key` with value `["attribute_value"]` SHOULD be recorded
          as the `rpc.response.trailer.my-custom-key` attribute with value `["attribute_value"]`.

          The attribute value MUST consist of either multiple values as an array of strings or a
          single-item array containing a possibly comma-concatenated string, depending on the way
          the RPC library provides access to trailers.

          Values under keys ending in [`-bin`](https://github.com/grpc/grpc/blob/v1.75.0/doc/PROTOCOL-HTTP2.md#requests) are binary and SHOULD be
          base64-encoded when recorded.

span_refinements:
  - id: span.rpc.grpc.call.client
    ref: rpc.call.client
    stability: release_candidate
    annotations:
      compatibility:
        # The existing gRPC span is now a refinement of the shared RPC span.
        policy_exceptions:
          - span_missing
    brief: This span represents an outgoing Remote Procedure Call (RPC).
    note: |
      `rpc.system.name` MUST be set to `"grpc"` and SHOULD be provided **at span creation time.**

      **Span name:** refer to the [Span Name](/docs/rpc/rpc-spans.md#name) section.

      **Span kind** MUST be `CLIENT`.

      **Span status**: refer to the [Recording Errors](/docs/general/recording-errors.md)
      document for details on how to record span status. See also `rpc.status_code` attribute
      for the details on which values classify as errors.
    attributes:
      - ref_group: rpc.grpc.attributes.common
      - ref_group: rpc.grpc.attributes.client
      - ref_group: rpc.grpc.attributes.span

  - id: span.rpc.grpc.call.server
    ref: rpc.call.server
    stability: release_candidate
    annotations:
      compatibility:
        # The existing gRPC span is now a refinement of the shared RPC span.
        policy_exceptions:
          - span_missing
    brief: This span represents an incoming Remote Procedure Call (RPC).
    note: |
      `rpc.system.name` MUST be set to `"grpc"` and SHOULD be provided **at span creation time.**

      **Span name:** refer to the [Span Name](/docs/rpc/rpc-spans.md#name) section.

      **Span kind** MUST be `SERVER`.

      **Span status**: refer to the [Recording Errors](/docs/general/recording-errors.md)
      document for details on how to record span status. See also `rpc.status_code` attribute
      for the details on which values classify as errors.
    attributes:
      - ref_group: rpc.grpc.attributes.common
      - ref_group: rpc.grpc.attributes.server
      - ref_group: rpc.grpc.attributes.span
      - ref: server.port
        requirement_level:
          conditionally_required: If `server.address` is set and the port is present in `:authority`.

metric_refinements:
  - id: metric.rpc.grpc.server.call.duration
    ref: rpc.server.call.duration
    brief: Measures the duration of an incoming gRPC call.
    note: |
      When this metric is reported alongside an RPC server span, the metric value
      SHOULD be the same as the RPC server span duration.
    attributes:
      - ref_group: rpc.grpc.attributes.common
      - ref_group: rpc.grpc.attributes.server

  - id: metric.rpc.grpc.client.call.duration
    ref: rpc.client.call.duration
    brief: Measures the duration of an outgoing gRPC call.
    note: |
      When this metric is reported alongside an RPC client span, the metric value
      SHOULD be the same as the RPC client span duration.
    attributes:
      - ref_group: rpc.grpc.attributes.common
      - ref_group: rpc.grpc.attributes.client
