groups:
  - id: registry.faas.deprecated
    brief: Deprecated FaaS attributes
    type: attribute_group
    display_name: Deprecated Function as a Service Attributes
    attributes:
      - id: faas.coldstart
        type: boolean
        deprecated:
          reason: renamed
          renamed_to: faas.invocation.cold_start
        brief: >
          A boolean that is true if the serverless function is executed for the
          first time (aka cold-start).
      - id: faas.invocation_id
        type: string
        deprecated:
          reason: renamed
          renamed_to: faas.invocation.id
        brief: >
          The invocation ID of the current function invocation.
        examples: 'af9d5aa4-a685-4c5f-a22b-444f80b3cc28'
        annotations:
          code_generation:
            exclude: true
      - id: faas.time
        type: string
        deprecated:
          reason: renamed
          renamed_to: faas.invocation.start_time
        brief: >
          A string containing the function invocation time in the
          [ISO 8601](https://www.iso.org/iso-8601-date-and-time-format.html)
          format expressed in [UTC](https://www.w3.org/TR/NOTE-datetime).
        examples: "2020-01-23T13:47:06Z"
