# yaml-language-server: $schema=https://raw.githubusercontent.com/open-telemetry/weaver/v0.26.1/schemas/semconv.schema.v2.json
file_format: definition/2
events:
  - name: faas.invocation.exception
    stability: development
    brief: >
      This event represents an exception that occurred during FaaS function invocation,
      such as application errors, internal failures, or other exceptions that prevent
      the function from completing successfully.
    note: >
      This event SHOULD be recorded when an exception occurs during FaaS function invocation.

      Instrumentations SHOULD set the severity to ERROR (severity number 17) when recording this event.

      Instrumentations MAY provide a configuration option to populate exception events
      with the attributes captured on the corresponding FaaS span.
    attributes:
      - ref_group: exception
