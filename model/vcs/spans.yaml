groups:
  - id: span.vcs.client
    type: span
    span_kind: client
    stability: development
    brief: >
      This span describes a Version Control System (VCS) operation that interacts with a remote, such as cloning a repository or pushing a commit.
    note: |
      VCS client spans are typically emitted by wrapper tools and CLI utilities performing Git, SVN, Mercurial, or Perforce operations that interact with a remote repository.

      **Span name** MUST follow the overall [guidelines for span names](https://github.com/open-telemetry/opentelemetry-specification/blob/v1.60.0/specification/trace/api.md#span).

      The span name SHOULD follow the `{vcs.operation.name} {vcs.repository.name}` pattern.
      If the operation target is more specific (e.g. a branch or ref), the span name MAY be `{vcs.operation.name} {vcs.ref.head.name}`
      or `{vcs.operation.name} {vcs.repository.name} {vcs.ref.head.name}`.

    attributes:
      - ref: vcs.operation.name
        requirement_level: required
      - ref: vcs.repository.name
        requirement_level: required
      - ref: vcs.repository.url.full
        requirement_level: opt_in
      - ref: vcs.owner.name
        requirement_level: opt_in
      - ref: process.command_args
        requirement_level: opt_in
      - ref: process.command_line
        requirement_level: opt_in
      - ref: process.working_directory
        requirement_level: opt_in
      - ref: vcs.ref.head.name
        requirement_level: recommended
      - ref: vcs.ref.head.revision
        requirement_level: recommended
      - ref: vcs.ref.type
        requirement_level: recommended
      - ref: server.address
        brief: The remote VCS server address (e.g. github.com, gitlab.com, or self-hosted Git server).
        requirement_level: recommended
      - ref: server.port
        requirement_level: recommended
      - ref: error.type
        requirement_level:
          conditionally_required: If the VCS operation fails.
