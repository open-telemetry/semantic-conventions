groups:
  - id: registry.kafka
    type: attribute_group
    display_name: Kafka Attributes
    brief: >
      This group describes attributes specific to Apache Kafka.
    attributes:
      - id: kafka.message.key
        type: string
        stability: development
        brief: >
          Message keys in Kafka are used for grouping alike messages to ensure they're processed on the same partition.
          They differ from `messaging.message.id` in that they're not unique.
          If the key is `null`, the attribute MUST NOT be set.
        note: >
          If the key type is not string, its string representation has to be supplied for the attribute.
          If the key has no unambiguous, canonical string form, don't include its value.
        examples: 'myKey'
      - id: kafka.offset
        type: int
        stability: development
        brief: >
          The offset of a record in the corresponding Kafka partition.
        examples: 42
      - id: kafka.message.tombstone
        type: boolean
        stability: development
        brief: 'A boolean that is true if the message is a tombstone.'
      - id: kafka.cluster.id
        type: string
        stability: development
        brief: >
          The Kafka cluster ID, obtained from the broker metadata exposed through the
          Kafka client (or AdminClient) API.
        note: >
          The cluster ID is a unique identifier reported by the Kafka broker. It identifies
          the cluster independently of the individual brokers the client is configured to
          connect to, and remains stable even if broker hostnames, IP addresses, or ports change.
        examples: ['MkU3OEVBNTcwNTJENDM2Qk']
