# yaml-language-server: $schema=https://raw.githubusercontent.com/open-telemetry/weaver/v0.26.1/schemas/semconv.schema.v2.json
file_format: definition/2
attributes:
  - key: source.address
    type: string
    stability: development
    brief: >
      Source address as observed at the point of instrumentation - typically an IP address, or a
      UNIX domain socket name; a domain name only when the sender was addressed by name (for example
      a peer-to-peer node dialed by hostname), never obtained via reverse DNS lookup.
    note: >
      `source.address` SHOULD be the sender address as observed at the point of instrumentation, for example the
      source of the packet, flow, or exchange seen on the wire or socket. It SHOULD NOT be resolved to an address
      behind intermediaries such as proxies or load balancers, and reverse DNS lookup SHOULD NOT be used to obtain
      a domain name.
    examples: ['10.1.2.80', 'source.example.com', '/tmp/my.sock']
  - key: source.port
    type: int
    stability: development
    brief: 'Source port number'
    examples: [3389, 2888]
