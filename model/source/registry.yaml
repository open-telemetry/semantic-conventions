# yaml-language-server: $schema=https://raw.githubusercontent.com/open-telemetry/weaver/v0.28.0/schemas/semconv.schema.v2.json
file_format: definition/2
attributes:
  - key: source.address
    type: string
    stability: development
    brief: >
      Source address as observed at the point of instrumentation - typically an IP address, or a
      UNIX domain socket name; a domain name only when the sender was addressed by name (for example
      a peer-to-peer node dialed by hostname), never obtained via reverse DNS lookup.
    note: >
      `source.address` SHOULD be the sender address as observed at the point of instrumentation, for example the
      source of the packet, flow, or exchange seen on the wire or socket. Instrumentation SHOULD
      capture the available address and SHOULD NOT try to resolve the address behind intermediaries
      such as proxies or load balancers, or perform a reverse DNS lookup to obtain a domain name.
    examples: ['10.1.2.80', 'source.example.com', '/tmp/my.sock']
  - key: source.mac.address
    type: string
    stability: development
    brief: 'Source Media Access Control (MAC) address.'
    note: |
      MAC addresses MUST be represented in [IEEE RA hexadecimal form](https://standards.ieee.org/wp-content/uploads/import/documents/tutorials/eui.pdf):
      as hyphen-separated octets in uppercase hexadecimal form from most to least significant.

      > [!WARNING]
      >
      > This attribute may contain sensitive (PII) information.
    examples: ['00-00-5E-00-53-23']
  - key: source.as.number
    type: int
    stability: development
    brief: "The [Autonomous System Number (ASN)](https://www.iana.org/assignments/as-numbers/as-numbers.xhtml) associated with the source IP address."
    note: >
      This attribute SHOULD only be set when the source address is an IP address and the
      ASN is available from routing, enrichment, or lookup data. The value SHOULD be
      represented as an integer without the `AS` prefix.
    examples: [64496, 15169]
  - key: source.as.organization
    type: string
    stability: development
    brief: "The name of the organization associated with the autonomous system of the source IP address."
    note: >
      This attribute SHOULD only be set when `source.as.number` is set and the organization
      name is available. The value SHOULD be the organization name as provided by the lookup
      or enrichment source, not the AS name or short code.
    examples: ["Example Networks Inc.", "Google LLC"]
  - key: source.port
    type: int
    stability: development
    brief: 'Source port number'
    examples: [3389, 2888]
