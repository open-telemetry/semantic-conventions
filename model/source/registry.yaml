# yaml-language-server: $schema=https://raw.githubusercontent.com/open-telemetry/weaver/v0.26.1/schemas/semconv.schema.v2.json
file_format: definition/2
attributes:
  - key: source.address
    type: string
    stability: development
    brief: "Source address - domain name if available without reverse DNS lookup; otherwise, IP address or UNIX domain socket name."
    note: >
      When observed from the destination side, and when communicating through an intermediary, `source.address` SHOULD represent
      the source address behind any intermediaries, for example proxies, if it's available.
    examples: ['source.example.com', '10.1.2.80', '/tmp/my.sock']
  - key: source.as.number
    type: int
    stability: development
    brief: "The [Autonomous System Number (ASN)](https://www.iana.org/assignments/as-numbers/as-numbers.xhtml) associated with the source IP address."
    note: >
      This attribute SHOULD only be set when the source address is an IP address and the
      ASN is available from routing, enrichment, or lookup data. The value SHOULD be
      represented as an integer without the `AS` prefix.
    examples: [64496, 15169]
  - key: source.as.organization.name
    type: string
    stability: development
    brief: "The name of the organization associated with the autonomous system of the source IP address."
    note: >
      This attribute SHOULD only be set when `source.as.number` is set and the organization
      name is available. The value SHOULD be the organization name as provided by the lookup
      or enrichment source, not the AS name or short code.
    examples: ["Example Networks Inc.", "Google LLC"]
  - key: source.port
    type: int
    stability: development
    brief: 'Source port number'
    examples: [3389, 2888]
