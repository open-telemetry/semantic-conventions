# yaml-language-server: $schema=https://raw.githubusercontent.com/open-telemetry/weaver/v0.25.1/schemas/semconv.schema.v2.json
file_format: definition/2
attributes:
  - key: source.address
    type: string
    stability: development
    brief: "Source address - domain name if available without reverse DNS lookup; otherwise, IP address or UNIX domain socket name."
    note: >
      `source.address` SHOULD be the sender address as observed at the point of instrumentation, for example the
      source of the packet, flow, or exchange seen on the wire or socket. It SHOULD NOT be resolved to an address
      behind intermediaries such as proxies or load balancers.
    examples: ['source.example.com', '10.1.2.80', '/tmp/my.sock']
  - key: source.port
    type: int
    stability: development
    brief: 'Source port number'
    examples: [3389, 2888]
