# yaml-language-server: $schema=https://raw.githubusercontent.com/open-telemetry/weaver/v0.26.1/schemas/semconv.schema.v2.json
file_format: definition/2
attribute_groups:
  - id: source
    visibility: public
    stability: development
    brief: >
      `source.*` attributes describe the sender of a network exchange or packet, recorded as
      observed at the point of instrumentation rather than resolved to an identity behind
      intermediaries such as proxies.


      Use them when there is no client/server relationship between the two sides, or when that
      relationship is unknown - for example, packet-level telemetry and peer-to-peer protocols.
    attributes:
      - ref: source.address
      - ref: source.port
