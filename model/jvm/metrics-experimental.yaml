groups:
  - id: metric.jvm.memory.init
    type: metric
    metric_name: jvm.memory.init
    annotations:
      code_generation:
        metric_value_type: int
    stability: development
    extends: attributes.jvm.memory
    brief: "Measure of initial memory requested."
    instrument: updowncounter
    unit: "By"

  - id: metric.jvm.system.cpu.utilization
    type: metric
    metric_name: jvm.system.cpu.utilization
    annotations:
      code_generation:
        metric_value_type: double
    stability: development
    brief: "Recent CPU utilization for the whole system as reported by the JVM."
    note: >
      The value range is [0.0,1.0].
      This utilization is not defined as being for the specific interval since last measurement
      (unlike `system.cpu.utilization`).
      [Reference](https://docs.oracle.com/en/java/javase/17/docs/api/jdk.management/com/sun/management/OperatingSystemMXBean.html#getCpuLoad()).
    instrument: gauge
    unit: "1"

  - id: metric.jvm.system.cpu.load_1m
    type: metric
    metric_name: jvm.system.cpu.load_1m
    annotations:
      code_generation:
        metric_value_type: double
    stability: development
    brief: "Average CPU load of the whole system for the last minute as reported by the JVM."
    note: >
      The value range is [0,n], where n is the number of CPU cores - or a negative number if the value is not available.
      This utilization is not defined as being for the specific interval since last measurement
      (unlike `system.cpu.utilization`).
      [Reference](https://docs.oracle.com/en/java/javase/17/docs/api/java.management/java/lang/management/OperatingSystemMXBean.html#getSystemLoadAverage()).
    instrument: gauge
    unit: "{run_queue_item}"

  - id: attributes.jvm.buffer
    type: attribute_group
    brief: "Describes JVM buffer metric attributes."
    attributes:
      - ref: jvm.buffer.pool.name
        requirement_level: recommended

  - id: metric.jvm.buffer.memory.used
    type: metric
    metric_name: jvm.buffer.memory.used
    annotations:
      code_generation:
        metric_value_type: int
    stability: development
    extends: attributes.jvm.buffer
    brief: "Measure of memory used by buffers."
    instrument: updowncounter
    unit: "By"

  - id: metric.jvm.buffer.memory.limit
    type: metric
    metric_name: jvm.buffer.memory.limit
    annotations:
      code_generation:
        metric_value_type: int
    stability: development
    extends: attributes.jvm.buffer
    brief: "Measure of total memory capacity of buffers."
    instrument: updowncounter
    unit: "By"

  - id: metric.jvm.buffer.count
    type: metric
    metric_name: jvm.buffer.count
    annotations:
      code_generation:
        metric_value_type: int
    stability: development
    extends: attributes.jvm.buffer
    brief: "Number of buffers in the pool."
    instrument: updowncounter
    unit: "{buffer}"

  - id: metric.jvm.file_descriptor.count
    type: metric
    metric_name: jvm.file_descriptor.count
    annotations:
      code_generation:
        metric_value_type: int
    stability: development
    brief: "Number of open file descriptors as reported by the JVM."
    instrument: updowncounter
    unit: "{file_descriptor}"

  - id: metric.jvm.file_descriptor.limit
    type: metric
    metric_name: jvm.file_descriptor.limit
    annotations:
      code_generation:
        metric_value_type: int
    stability: development
    brief: "Measure of max open file descriptors as reported by the JVM."
    instrument: updowncounter
    unit: "{file_descriptor}"

  - id: attributes.jvm.executor
    type: attribute_group
    brief: "Describes JVM executor metric attributes."
    attributes:
      - ref: jvm.executor.name
        requirement_level: required
      - ref: jvm.executor.owner.name
        requirement_level: recommended
      - ref: jvm.executor.type
        requirement_level: required

  - id: metric.jvm.executor.thread.count
    type: metric
    metric_name: jvm.executor.thread.count
    annotations:
      code_generation:
        metric_value_type: int
    stability: development
    extends: attributes.jvm.executor
    brief: >
      The number of executor threads that are currently in the state described by the
      `jvm.executor.thread.state` attribute.
    instrument: updowncounter
    unit: "{thread}"
    attributes:
      - ref: jvm.executor.thread.state
        requirement_level: required

  - id: metric.jvm.executor.thread.core
    type: metric
    metric_name: jvm.executor.thread.core
    annotations:
      code_generation:
        metric_value_type: int
    stability: development
    extends: attributes.jvm.executor
    brief: "The number of core threads configured for the executor."
    instrument: updowncounter
    unit: "{thread}"

  - id: metric.jvm.executor.thread.max
    type: metric
    metric_name: jvm.executor.thread.max
    annotations:
      code_generation:
        metric_value_type: int
    stability: development
    extends: attributes.jvm.executor
    brief: "The maximum number of threads allowed for the executor."
    note: >
      Instrumentations SHOULD emit this metric only when the maximum thread count is finite and
      represents a meaningful operational limit. This metric SHOULD NOT be emitted for unbounded
      or effectively unbounded executors. For example, an executor with a maximum thread count of
      `Integer.MAX_VALUE` is effectively unbounded.
    instrument: updowncounter
    unit: "{thread}"

  - id: metric.jvm.executor.queue.size
    type: metric
    metric_name: jvm.executor.queue.size
    annotations:
      code_generation:
        metric_value_type: int
    stability: development
    extends: attributes.jvm.executor
    brief: "The number of tasks currently queued for execution."
    instrument: updowncounter
    unit: "{task}"

  - id: metric.jvm.executor.queue.capacity
    type: metric
    metric_name: jvm.executor.queue.capacity
    annotations:
      code_generation:
        metric_value_type: int
    stability: development
    extends: attributes.jvm.executor
    brief: "The maximum number of tasks the executor queue can hold."
    note: >
      Instrumentations SHOULD emit this metric only when the queue has a finite capacity that
      represents a meaningful operational limit. This metric SHOULD NOT be emitted for unbounded
      or effectively unbounded queues.
    instrument: updowncounter
    unit: "{task}"

  - id: metric.jvm.executor.task.completed
    type: metric
    metric_name: jvm.executor.task.completed
    annotations:
      code_generation:
        metric_value_type: int
    stability: development
    extends: attributes.jvm.executor
    brief: "The number of tasks completed by the executor."
    instrument: counter
    unit: "{task}"

  - id: metric.jvm.executor.task.rejected
    type: metric
    metric_name: jvm.executor.task.rejected
    annotations:
      code_generation:
        metric_value_type: int
    stability: development
    extends: attributes.jvm.executor
    brief: "The number of tasks rejected by the executor."
    instrument: counter
    unit: "{task}"
