# yaml-language-server: $schema=https://raw.githubusercontent.com/open-telemetry/weaver/v0.28.0/schemas/semconv.schema.v2.json
file_format: definition/2
attributes:
  - key: client.address
    stability: stable
    type: string
    brief: "Client address - domain name if available without reverse DNS lookup; otherwise, IP address or UNIX domain socket name."
    note: >
      When observed from the server side, and when communicating through an intermediary, `client.address` SHOULD represent
      the client address behind any intermediaries, for example proxies, if it's available.
    examples: ['client.example.com', '10.1.2.80', '/tmp/my.sock']
  - key: client.mac.address
    stability: development
    type: string
    brief: 'Client Media Access Control (MAC) address.'
    note: |
      This attribute MUST identify a MAC address associated with the logical client
      endpoint, including when that endpoint is behind intermediaries. If the client's
      MAC address is unknown, this attribute MUST NOT be set. The MAC address of a
      proxy, gateway, or next-hop router MUST NOT be used as a substitute.

      MAC addresses MUST be represented in [IEEE RA hexadecimal form](https://standards.ieee.org/wp-content/uploads/import/documents/tutorials/eui.pdf):
      as hyphen-separated octets in uppercase hexadecimal form from most to least significant.

      > [!WARNING]
      >
      > This attribute may contain sensitive (PII) information.
    examples: ['00-00-5E-00-53-23']
  - key: client.as.number
    stability: development
    type: int
    brief: "The [Autonomous System Number (ASN)](https://www.iana.org/assignments/as-numbers/as-numbers.xhtml) associated with the client IP address."
    note: >
      This attribute SHOULD only be set when the client address is an IP address and the
      ASN is available from routing, enrichment, or lookup data. The value SHOULD be
      represented as an integer without the `AS` prefix.
    examples: [64496, 15169]
  - key: client.as.organization
    stability: development
    type: string
    brief: "The name of the organization associated with the autonomous system of the client IP address."
    note: >
      This attribute SHOULD only be set when `client.as.number` is set and the organization
      name is available. The value SHOULD be the organization name as provided by the lookup
      or enrichment source, not the AS name or short code.
    examples: ["Example Networks Inc.", "Google LLC"]
  - key: client.port
    stability: stable
    type: int
    brief: Client port number.
    examples: [65123]
    note: >
      When observed from the server side, and when communicating through an intermediary, `client.port` SHOULD represent
      the client port behind any intermediaries, for example proxies, if it's available.
  - key: client.service.name
    stability: development
    type: string
    brief: >
      Logical name of the service acting as the client in a connection-based network interaction.
    note: >
      SHOULD be equal to the actual [`service.name`](/docs/resource/README.md#service) resource attribute
      of the logical client, if any.
      This identifies the client service whether the telemetry is recorded by the client, the server, or another observer.
    examples: ['shoppingcart']
  - key: client.service.namespace
    stability: development
    type: string
    brief: >
      Logical namespace of the service acting as the client in a connection-based network interaction.
    note: >
      SHOULD be equal to the actual [`service.namespace`](/docs/resource/README.md#service) resource attribute
      of the logical client, if any.
      This identifies the client service's namespace whether the telemetry is recorded by the client, the server, or another observer.
      Together with `client.service.name`, this identifies the client service.
      An empty namespace is equivalent to an unspecified namespace.
    examples: ['Shop']
