# yaml-language-server: $schema=https://raw.githubusercontent.com/open-telemetry/weaver/v0.28.0/schemas/semconv.schema.v2.json
file_format: definition/2
attribute_groups:
  - id: client
    visibility: public
    stability: stable
    brief: >
      `client.*` attributes describe the client in a connection-based network interaction: the side
      that initiates the connection (the server is the side that accepts it). They identify the
      logical client, which - behind proxies or load balancers - can differ from the concrete
      socket endpoint and is typically recovered from headers such as `X-Forwarded-For`.


      Use them for interactions with a clear initiator and acceptor. This covers common TCP
      interactions, connection-oriented UDP such as QUIC (HTTP/3), and request/response protocols
      such as DNS and SNMP polling. It does not cover peer-to-peer communication where the protocol
      or API exposes no clear notion of client and server (even over TCP).
    attributes:
      - ref: client.address
      - ref: client.as.number
        requirement_level: opt_in
      - ref: client.as.organization
        requirement_level: opt_in
      - ref: client.mac.address
        requirement_level: opt_in
      - ref: client.prefix
        requirement_level: opt_in
      - ref: client.port
      - ref: client.service.name
        requirement_level: opt_in
      - ref: client.service.namespace
        requirement_level: opt_in
