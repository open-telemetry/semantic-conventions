change_type: enhancement
component: source
note: >
  Clarify that `source.address` and `source.port` describe the sender of a network exchange and are
  recorded as observed at the point of instrumentation, not resolved to an address behind
  intermediaries such as proxies. They apply when there is no clear or known client/server role
  (for example low-level flow/packet telemetry or peer-to-peer protocols); use `client.*` /
  `server.*` for logical, de-proxied identity when the roles are known.
