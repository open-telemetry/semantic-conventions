change_type: enhancement
component: rpc
note: Refine the recommended RPC call duration histogram bucket boundaries.
issues: [316]
subtext: |
  Adds intermediate boundaries using `1, 2.5, 5` subdivisions for both RPC client
  and server call duration histograms through 10 seconds, followed by boundaries
  at 30 and 60 seconds. Dubbo follows the general RPC bucket recommendations;
  gRPC bucket recommendations remain unchanged.
