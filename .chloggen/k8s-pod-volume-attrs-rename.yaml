change_type: breaking
component: k8s
note: Rename `k8s.volume.name` and `k8s.volume.type` attributes to `k8s.pod.volume.name` and `k8s.pod.volume.type`.
issues: [4156]
subtext: |
  These attributes describe an entry in the Pod spec's `volumes` list rather than a standalone
  Kubernetes object, so they now live under the `k8s.pod.volume.*` namespace alongside the
  `k8s.pod.volume.*` metrics.
  The `k8s.pod.volume.available`, `k8s.pod.volume.capacity`, `k8s.pod.volume.usage`,
  `k8s.pod.volume.inode.count`, `k8s.pod.volume.inode.used`, and `k8s.pod.volume.inode.free`
  metrics now use `k8s.pod.volume.name` and `k8s.pod.volume.type`.
  The old `k8s.volume.name` and `k8s.volume.type` attributes are deprecated.
