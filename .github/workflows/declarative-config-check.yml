name: Declarative Config Check

# Verifies that changes to semantic-conventions model YAML do not break
# opentelemetry-configuration's build.
#
# Mechanism: check out both repos, replace otel-config's `semantic-conventions`
# submodule directory with this PR's semconv checkout, run otel-config's
# compile + example validation.
#
# Scope: verifies otel-config schema compiles and its examples/snippets
# validate. Does not verify downstream SDK code generators still work.

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  declarative-config-check:
    runs-on: ubuntu-latest
    steps:
      - name: check out semantic-conventions (this PR)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: semantic-conventions
          persist-credentials: false

      - name: check out opentelemetry-configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pilot: point at the fork branch that carries the semconv merger.
          # Flip to open-telemetry/opentelemetry-configuration @ main once
          # the integration is upstream.
          repository: jack-berg/opentelemetry-configuration
          ref: semconv-integration
          path: opentelemetry-configuration
          persist-credentials: false
          submodules: true

      - name: setup node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v6.0.0
        with:
          node-version: '20'

      - name: install otel-config dependencies
        working-directory: opentelemetry-configuration
        run: npm install

      - name: compile baseline (pinned semconv commit)
        working-directory: opentelemetry-configuration
        run: |
          set -euo pipefail
          # First compile uses the submodule as-pinned. This is the baseline
          # against which we measure the PR's effect below. Compiling here
          # rather than trusting the checked-in JSON keeps the diff isolated
          # to this PR even if the checked-in file happens to be stale.
          make compile-schema
          cp opentelemetry_configuration.json /tmp/baseline.json

      - name: override otel-config semantic-conventions submodule
        run: |
          set -euo pipefail
          # Replace the pinned submodule contents with this PR's semconv
          # checkout so the next compile reflects the PR.
          rm -rf opentelemetry-configuration/semantic-conventions
          ln -s "$GITHUB_WORKSPACE/semantic-conventions" opentelemetry-configuration/semantic-conventions
          ls -la opentelemetry-configuration/semantic-conventions/model | head -5

      - name: compile otel-config schema
        id: compile
        working-directory: opentelemetry-configuration
        run: make compile-schema

      - name: explain compile failure
        if: failure() && steps.compile.conclusion == 'failure'
        run: |
          {
            echo '## Compile against opentelemetry-configuration failed'
            echo ''
            echo 'This check runs `make compile-schema` in opentelemetry-configuration'
            echo 'with its `semantic-conventions` submodule pointed at this PR. The'
            echo 'failure above comes from otel-config''s merger, not from semconv itself.'
            echo ''
            echo 'Errors originate in `scripts/merge-semconv-config.js` in otel-config.'
            echo 'A fix typically requires a companion PR against otel-config.'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: report compiled schema and diff
        working-directory: opentelemetry-configuration
        run: |
          set -euo pipefail
          # Diff the PR compile against the pinned-baseline compile from an
          # earlier step. This isolates the diff to just this PR's effect,
          # regardless of how far otel-config's pinned semconv commit lags
          # behind semconv main.
          {
            echo '## Compiled schema'
            echo ''
            echo "- Size: $(wc -c < opentelemetry_configuration.json) bytes"
            echo "- Types in \$defs: $(node -e 'console.log(Object.keys(JSON.parse(require("fs").readFileSync("opentelemetry_configuration.json","utf8"))["$defs"]||{}).length)')"
            echo ''
            echo '## Diff vs pinned baseline'
            echo ''
            if diff -q /tmp/baseline.json opentelemetry_configuration.json > /dev/null; then
              echo '_No change to compiled schema._'
            else
              echo '```diff'
              diff -u /tmp/baseline.json opentelemetry_configuration.json || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # Also echo the diff into the run log for easy grepping.
          echo '--- diff ---'
          diff -u /tmp/baseline.json opentelemetry_configuration.json || true

      - name: upload compiled schema artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opentelemetry_configuration.json
          path: opentelemetry-configuration/opentelemetry_configuration.json

      - name: validate otel-config examples
        working-directory: opentelemetry-configuration
        run: make validate-examples
