name: Create release draft

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to release, e.g. 1.45.0'
        required: true
      commit:
        description: 'Full commit SHA of the merged release PR'
        required: true

permissions:
  contents: read

jobs:
  create-release:
    runs-on: ubuntu-latest
    if: >-
      github.repository_owner == 'open-telemetry' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.merged == true &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'otelbot/prepare-release-v')))
    permissions:
      contents: write # required for creating the draft and uploading assets
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_COMMIT: ${{ inputs.commit || github.event.pull_request.merge_commit_sha }}
    steps:
      - name: Validate release inputs
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            RELEASE_VERSION="${RELEASE_BRANCH#otelbot/prepare-release-v}"
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "unexpected release version: $RELEASE_VERSION"
            exit 1
          fi
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          if [[ ! "$RELEASE_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "expected a full commit SHA: $RELEASE_COMMIT"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          persist-credentials: false

      - name: Generate development schema
        run: |
          make generate-schema-dev VERSION="$RELEASE_VERSION" \
            DEV_SCHEMA_OUTPUT="$PWD/internal/tools/bin/schema-dev/release" \
            RESOLVED_REGISTRY_URI="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/v${RELEASE_VERSION}/resolved.yaml"

      - name: Create draft with schema assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$RELEASE_VERSION" \
            internal/tools/bin/schema-dev/release/resolved.yaml \
            internal/tools/bin/schema-dev/release/manifest.yaml \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_COMMIT" \
            --title "v$RELEASE_VERSION" \
            --generate-notes \
            --draft
