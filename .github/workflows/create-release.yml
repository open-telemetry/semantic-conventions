name: Create release draft

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to release, e.g. 1.45.0'
        required: true
      commit:
        description: 'Full commit SHA of the merged release PR'
        required: true

permissions:
  contents: read

jobs:
  create-release:
    runs-on: ubuntu-latest
    if: >-
      github.repository_owner == 'open-telemetry' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.merged == true &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'otelbot/prepare-release-v')))
    permissions:
      contents: write # required for creating the draft and uploading assets
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_COMMIT: ${{ inputs.commit || github.event.pull_request.merge_commit_sha }}
    steps:
      - name: Validate release inputs
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            RELEASE_VERSION="${RELEASE_BRANCH#otelbot/prepare-release-v}"
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "unexpected release version: $RELEASE_VERSION"
            exit 1
          fi
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          if [[ ! "$RELEASE_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "expected a full commit SHA: $RELEASE_COMMIT"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          persist-credentials: false

      - name: Generate development publication schema
        run: |
          make generate-publication-schema-dev VERSION="$RELEASE_VERSION" \
            DEV_PUBLICATION_SCHEMA_OUTPUT="$PWD/internal/tools/bin/publication-schema-dev/release" \
            RESOLVED_REGISTRY_URI="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/v${RELEASE_VERSION}/registry-dev.yaml"

      - name: Check manifests in the release commit
        run: |
          expected="schema_url: https://opentelemetry.io/schemas/semconv-dev/${RELEASE_VERSION}-dev"
          if ! grep -qx "$expected" model/manifest.yaml; then
            echo "::error::model/manifest.yaml schema_url doesn't match v${RELEASE_VERSION}"
            exit 1
          fi
          committed="schemas/semconv-dev/${RELEASE_VERSION}-dev"
          if [[ ! -f "$committed" ]]; then
            echo "::error::$committed not found in the release commit"
            exit 1
          fi
          diff -u "$committed" internal/tools/bin/publication-schema-dev/release/manifest-dev.yaml

      - name: Create draft with schema assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            internal/tools/bin/publication-schema-dev/release/registry-dev.yaml
            internal/tools/bin/publication-schema-dev/release/manifest-dev.yaml
          )
          # Re-runs refresh the assets on the existing draft instead of creating a second one.
          if is_draft=$(gh release view "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$is_draft" != "true" ]]; then
              echo "::error::release v$RELEASE_VERSION is already published"
              exit 1
            fi
            gh release upload "v$RELEASE_VERSION" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          gh release create "v$RELEASE_VERSION" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_COMMIT" \
            --title "v$RELEASE_VERSION" \
            --generate-notes \
            --draft
